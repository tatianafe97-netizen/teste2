<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mineração de Bitcoin em Shorts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;800&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#070707;--ink:#F4F1EA;--muted:#a8a39a;--yellow:#FFE600;--line:#2a2a2a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Montserrat,"Arial Black",Arial,sans-serif;overflow:hidden}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;height:min(100vh,calc(100vw*16/9));height:min(100dvh,calc(100vw*16/9));aspect-ratio:9/16;background:#121212;box-shadow:0 0 80px rgba(0,0,0,.7);container-type:size;overflow:hidden}
canvas{display:block;width:100%;height:100%}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,8,8,.66);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);padding:6cqw}
.hidden{display:none!important}
.card{width:100%;display:flex;flex-direction:column;align-items:center;gap:2.2cqh;text-align:center}
.kicker{font-size:2.6cqw;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
h1,h2{margin:0;font-weight:900;line-height:1.05;font-size:8.4cqw}
h1 span{color:var(--yellow)}
.btn{appearance:none;border:0;cursor:pointer;font-family:inherit;font-weight:900;border-radius:999px;padding:2.2cqh 7cqw;font-size:5cqw;text-decoration:none;display:inline-block;transition:transform .12s ease}
.btn:hover{transform:scale(1.04)}.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:4px solid #fff;outline-offset:4px}
.primary{background:var(--yellow);color:#111;box-shadow:0 1cqh 0 #a99800}
.ghost{background:transparent;color:var(--ink);border:3px solid rgba(244,241,234,.45);font-size:3.8cqw;padding:1.5cqh 5cqw}
.opts{display:flex;flex-direction:column;gap:1.1cqh;font-size:3.6cqw;font-weight:700;text-align:left}
.opts label{display:flex;align-items:center;gap:2.4cqw;cursor:pointer}
.opts input{width:4.4cqw;height:4.4cqw;accent-color:#FFE600}
.hint{margin:0;font-size:2.8cqw;color:var(--muted);font-weight:700;line-height:1.4}
.rec{position:absolute;top:2.4cqh;right:3cqw;background:#e11;color:#fff;font-weight:900;font-size:3.2cqw;padding:.6cqh 2.6cqw;border-radius:999px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.dbg{position:absolute;left:2cqw;bottom:1cqh;font:700 2.6cqw/1.2 "JetBrains Mono",monospace;background:rgba(0,0,0,.6);padding:.4cqh 1.6cqw;border-radius:6px}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="c" width="1080" height="1920" aria-label="Animação explicando a mineração de Bitcoin"></canvas>
    <div id="rec" class="rec hidden">● REC</div>
    <div id="dbg" class="dbg hidden"></div>
    <div id="startOv" class="overlay">
      <div class="card">
        <div class="kicker" id="kicker">Vídeo vertical · 9:16 · 1080×1920 · 60fps</div>
        <h1>Como funciona a<br><span>mineração de Bitcoin</span></h1>
        <button id="btnStart" class="btn primary">▶ Iniciar Animação</button>
        <div class="opts">
          <label><input type="checkbox" id="optVoice" checked> <span id="voiceLbl">Narração com voz neural</span></label>
          <label><input type="checkbox" id="optMusic" checked> Batida de fundo</label>
          <label><input type="checkbox" id="optLoop"> Repetir em loop</label>
        </div>
        <button id="btnRec" class="btn ghost">● Gravar vídeo em arquivo</button>
        <p class="hint">Espaço: pausar · R: reiniciar · F: tela cheia<br>A gravação inclui narração, efeitos sonoros e batida.</p>
      </div>
    </div>
    <div id="endOv" class="overlay hidden">
      <div class="card">
        <h2>Fim do vídeo</h2>
        <button id="btnAgain" class="btn primary">↻ Repetir</button>
        <button id="btnRec2" class="btn ghost">● Gravar vídeo em arquivo</button>
        <a id="dl" class="btn ghost hidden" download>⬇ Baixar vídeo gravado</a>
        <p class="hint" id="recInfo"></p>
      </div>
    </div>
  </div>
</div>

const SK = { thigh: 62, shin: 60, torso: 112, upper: 54, fore: 52, headR: 38, neck: 6 };

  const ha = p.lean + p.tilt;

  fx.draw(ctx, lt, t);
  ctx.restore();
  if (fx.overlay) { ctx.save(); ctx.translate(sh.x * 0.5, sh.y * 0.5); fx.overlay(ctx, lt, t); ctx.restore(); }
  drawVignette(ctx);
  drawFlashes(ctx, t);
  ctx.save(); ctx.translate(sh.x * 0.3, sh.y * 0.3); drawHUD(ctx, t, si, lt); drawCaptions(ctx, t); ctx.restore();
}

/* =====================================================================
   NARRAÇÃO NEURAL EMBUTIDA (MP3 em base64 tocado no mesmo relógio do vídeo)
   ===================================================================== */
const Narr = {
  buf: null, src: null, pending: null,
  get available() { return !!NARRATION_AUDIO; },
  async load(ac) {
    if (this.buf || !ac || !this.available) return this.buf;
    if (!this.pending) this.pending = decodeAudio(ac, narrationBytes()).catch(e => { console.warn('narração', e); return null; });
    return (this.buf = await this.pending);
  },
  play(when) {
    const ac = AudioFX.ctx; this.stop();
    if (!ac || !this.buf) return;
    this.src = ac.createBufferSource(); this.src.buffer = this.buf; this.src.connect(AudioFX.voiceBus); this.src.start(when);
  },
  stop() { if (this.src) { try { this.src.stop(); } catch (e) { } this.src.disconnect(); this.src = null; } }
};

/* =====================================================================
   RELÓGIO, AGENDADOR E LOOP PRINCIPAL (requestAnimationFrame)
   ===================================================================== */
const Clock = {
  useAudio: false, t0: 0, pausedAt: null,
  now() { const ac = AudioFX.ctx; return this.useAudio && ac ? ac.currentTime : performance.now() / 1000; },
  start(delay = 0.15) { const ac = AudioFX.ctx; this.useAudio = !!ac && ac.state === 'running'; this.t0 = this.now() + delay; this.pausedAt = null; },
  time() { return (this.pausedAt != null ? this.pausedAt : this.now()) - this.t0; },
  pause() { if (this.pausedAt == null) this.pausedAt = this.now(); },
  resume() { if (this.pausedAt != null) { this.t0 += this.now() - this.pausedAt; this.pausedAt = null; } },
  toPerf() { const t = this.time(); this.useAudio = false; this.t0 = performance.now() / 1000 - t; }
};
const opts = { voice: true, music: true, loop: false };
const state = { started: false, ended: false, paused: false, recording: false, preview: null, evIdx: 0, lastScene: -1 };
let recorder = null, recChunks = [], recMime = '';

function scheduleAudio(t) {
  const ac = AudioFX.ctx;
  if (!ac || !Clock.useAudio || ac.state !== 'running') { while (state.evIdx < EV.length && EV[state.evIdx].t <= t) state.evIdx++; return; }
  while (state.evIdx < EV.length && EV[state.evIdx].t <= t + 0.12) {
    const e = EV[state.evIdx++];
    if (e.t < t - 0.06 || (e.music && !opts.music)) continue;
    try { AudioFX.S[e.n](Math.max(Clock.t0 + e.t, ac.currentTime), ...e.a); } catch (err) { console.warn('som', e.n, err); }
  }
}
const $ = id => document.getElementById(id);
const dbg = new URLSearchParams(location.search).has('debug');
function frame() {
  requestAnimationFrame(frame);
  let t;
  if (state.preview != null) t = state.preview;
  else if (!state.started) t = 0;
  else {
    const ac = AudioFX.ctx;
    if (Clock.useAudio && (!ac || ac.state !== 'running') && !state.paused) { Clock.toPerf(); Narr.stop(); }
    t = Clock.time();
    if (t >= DURATION && !state.ended) {
      if (opts.loop && !state.recording) { restartPlayback(0); t = Clock.time(); }
      else finish();
    }
    if (!state.ended && !state.paused && t >= 0) scheduleAudio(t);
  }
  render(Math.max(0, t));
  if (dbg) $('dbg').textContent = `t=${Math.max(0, t).toFixed(2)}s  cena ${sceneAt(Math.max(0, t)) + 1}`;
}
async function ensureAudio() {
  const ac = AudioFX.init();
  if (ac && ac.state !== 'running') { try { await ac.resume(); } catch (e) { console.warn(e); } }
  if (opts.voice) await Narr.load(ac);
  AudioFX.setDuck(opts.voice && !!Narr.buf); AudioFX.setMusic(opts.music);
  return ac;
}
function readOpts() { opts.voice = $('optVoice').checked && Narr.available; opts.music = $('optMusic').checked; opts.loop = $('optLoop').checked; }
function restartPlayback(delay = 0.15) {
  Narr.stop(); Clock.start(delay);
  if (opts.voice && Clock.useAudio) Narr.play(Clock.t0);
  state.started = true; state.ended = false; state.paused = false; state.evIdx = 0; state.lastScene = -1;
  $('startOv').classList.add('hidden'); $('endOv').classList.add('hidden');
}
async function startPlayback() { readOpts(); await ensureAudio(); restartPlayback(); }
function finish() {
  state.ended = true; Narr.stop();
  if (state.recording && recorder) { setTimeout(() => { try { recorder.stop(); } catch (e) { } }, 200); }
  $('endOv').classList.remove('hidden');
}
async function togglePause() {
  if (!state.started || state.ended || state.recording) return;
  const ac = AudioFX.ctx;
  if (!state.paused) { state.paused = true; Clock.pause(); if (ac && Clock.useAudio) await ac.suspend(); }
  else { if (ac && Clock.useAudio) await ac.resume(); Clock.resume(); state.paused = false; }
}
async function startRecording() {
  if (!window.MediaRecorder || !canvas.captureStream) { $('recInfo').textContent = 'Este navegador não suporta gravação (MediaRecorder). Use Chrome, Edge ou Firefox atualizados.'; $('endOv').classList.remove('hidden'); return; }
  readOpts(); await ensureAudio();
  const tracks = [...canvas.captureStream(FPS).getVideoTracks()];
  if (AudioFX.recStream) tracks.push(...AudioFX.recStream.getAudioTracks());
  const types = ['video/mp4;codecs=avc1.640028,mp4a.40.2', 'video/mp4;codecs=avc1,mp4a', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm', 'video/mp4'];
  recMime = types.find(x => MediaRecorder.isTypeSupported(x)) || '';
  recorder = new MediaRecorder(new MediaStream(tracks), recMime ? { mimeType: recMime, videoBitsPerSecond: 16000000, audioBitsPerSecond: 192000 } : undefined);
  recChunks = [];
  recorder.ondataavailable = e => { if (e.data && e.data.size) recChunks.push(e.data); };
  recorder.onstop = () => {
    state.recording = false; $('rec').classList.add('hidden');
    const type = recorder.mimeType || recMime || 'video/webm', ext = type.includes('mp4') ? 'mp4' : 'webm';
    const url = URL.createObjectURL(new Blob(recChunks, { type }));
    const a = $('dl'); a.href = url; a.download = `mineracao-bitcoin-9x16.${ext}`; a.classList.remove('hidden');
    $('recInfo').textContent = `Arquivo .${ext} pronto (1080×1920). ` + (ext === 'webm' ? 'Para MP4: ffmpeg -i mineracao-bitcoin-9x16.webm -c:v libx264 -pix_fmt yuv420p -r 60 -c:a aac mineracao.mp4' : '');
    a.click();
  };
  state.recording = true; $('rec').classList.remove('hidden'); $('dl').classList.add('hidden'); $('recInfo').textContent = '';
  recorder.start(250);
  restartPlayback(0.25);
}

/* ---------------------------- INTERFACE ---------------------------- */
$('btnStart').addEventListener('click', startPlayback);
$('btnAgain').addEventListener('click', startPlayback);
$('btnRec').addEventListener('click', startRecording);
$('btnRec2').addEventListener('click', startRecording);
$('optMusic').addEventListener('change', e => { opts.music = e.target.checked; AudioFX.setMusic(opts.music); });
document.addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); if (!state.started) startPlayback(); else togglePause(); }
  else if (e.key === 'r' || e.key === 'R') { if (!state.recording) startPlayback(); }
  else if (e.key === 'f' || e.key === 'F') { const el = $('stage'); if (!document.fullscreenElement) el.requestFullscreen && el.requestFullscreen(); else document.exitFullscreen(); }
});
document.addEventListener('visibilitychange', () => { if (document.hidden && state.recording) $('recInfo').textContent = 'Atenção: a aba ficou oculta durante a gravação; o vídeo pode ter travado.'; });

/* ---------------------------- INICIALIZAÇÃO ---------------------------- */
applyNarration();
buildCaptions();
buildKeys();
buildSceneTiming();
buildTimeline();
$('kicker').textContent = `Vídeo vertical · 9:16 · 1080×1920 · ${DURATION.toFixed(1).replace('.', ',')}s · 60fps`;
if (!Narr.available) { $('optVoice').checked = false; $('optVoice').disabled = true; $('voiceLbl').textContent = 'Narração neural (rode gerar-narracao.py)'; }
window.__mining = { render, renderAudioOffline, DURATION, FPS, SCENES, PAGES, WORDS, K, EV };
(() => {
  const q = new URLSearchParams(location.search);
  if (q.has('t')) { state.preview = clamp(parseFloat(q.get('t')) || 0, 0, DURATION - 1e-4); $('startOv').classList.add('hidden'); }
  else if (q.has('autoplay')) { readOpts(); restartPlayback(0.05); }
  if (dbg) $('dbg').classList.remove('hidden');
  if (q.has('export')) { $('startOv').classList.add('hidden'); render(0); return; }   /* modo exportação: quadros sob demanda */
  if (document.fonts && document.fonts.load) Promise.all([document.fonts.load(`900 76px Montserrat`), document.fonts.load(`800 34px "JetBrains Mono"`)]).catch(() => { });
  requestAnimationFrame(frame);
})();
</script>
