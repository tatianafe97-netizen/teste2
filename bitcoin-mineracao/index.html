<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mineração de Bitcoin em 48s</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;800&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#070707;--ink:#F4F1EA;--muted:#a8a39a;--yellow:#FFE600;--line:#2a2a2a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Montserrat,"Arial Black",Arial,sans-serif;overflow:hidden}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;height:min(100vh,calc(100vw*16/9));height:min(100dvh,calc(100vw*16/9));aspect-ratio:9/16;background:#121212;box-shadow:0 0 80px rgba(0,0,0,.7);container-type:size;overflow:hidden}
canvas{display:block;width:100%;height:100%}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,8,8,.66);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);padding:6cqw}
.hidden{display:none!important}
.card{width:100%;display:flex;flex-direction:column;align-items:center;gap:2.2cqh;text-align:center}
.kicker{font-size:2.6cqw;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
h1,h2{margin:0;font-weight:900;line-height:1.05;font-size:8.4cqw}
h1 span{color:var(--yellow)}
.btn{appearance:none;border:0;cursor:pointer;font-family:inherit;font-weight:900;border-radius:999px;padding:2.2cqh 7cqw;font-size:5cqw;text-decoration:none;display:inline-block;transition:transform .12s ease}
.btn:hover{transform:scale(1.04)}.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:4px solid #fff;outline-offset:4px}
.primary{background:var(--yellow);color:#111;box-shadow:0 1cqh 0 #a99800}
.ghost{background:transparent;color:var(--ink);border:3px solid rgba(244,241,234,.45);font-size:3.8cqw;padding:1.5cqh 5cqw}
.opts{display:flex;flex-direction:column;gap:1.1cqh;font-size:3.6cqw;font-weight:700;text-align:left}
.opts label{display:flex;align-items:center;gap:2.4cqw;cursor:pointer}
.opts input{width:4.4cqw;height:4.4cqw;accent-color:#FFE600}
.hint{margin:0;font-size:2.8cqw;color:var(--muted);font-weight:700;line-height:1.4}
.rec{position:absolute;top:2.4cqh;right:3cqw;background:#e11;color:#fff;font-weight:900;font-size:3.2cqw;padding:.6cqh 2.6cqw;border-radius:999px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.dbg{position:absolute;left:2cqw;bottom:1cqh;font:700 2.6cqw/1.2 "JetBrains Mono",monospace;background:rgba(0,0,0,.6);padding:.4cqh 1.6cqw;border-radius:6px}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="c" width="1080" height="1920" aria-label="Animação explicando a mineração de Bitcoin"></canvas>
    <div id="rec" class="rec hidden">● REC</div>
    <div id="dbg" class="dbg hidden"></div>
    <div id="startOv" class="overlay">
      <div class="card">
        <div class="kicker">Vídeo vertical · 9:16 · 1080×1920 · 48s · 60fps</div>
        <h1>Como funciona a<br><span>mineração de Bitcoin</span></h1>
        <button id="btnStart" class="btn primary">▶ Iniciar Animação</button>
        <div class="opts">
          <label><input type="checkbox" id="optVoice"> Narração por voz sintética (Web Speech)</label>
          <label><input type="checkbox" id="optMusic" checked> Batida de fundo</label>
          <label><input type="checkbox" id="optLoop"> Repetir em loop</label>
        </div>
        <button id="btnRec" class="btn ghost">● Gravar vídeo em arquivo</button>
        <p class="hint">Espaço: pausar · R: reiniciar · F: tela cheia<br>A gravação inclui os efeitos sonoros (a voz sintética não é capturada pelo navegador).</p>
      </div>
    </div>
    <div id="endOv" class="overlay hidden">
      <div class="card">
        <h2>Fim do vídeo</h2>
        <button id="btnAgain" class="btn primary">↻ Repetir</button>
        <button id="btnRec2" class="btn ghost">● Gravar vídeo em arquivo</button>
        <a id="dl" class="btn ghost hidden" download>⬇ Baixar vídeo gravado</a>
        <p class="hint" id="recInfo"></p>
      </div>
    </div>
  </div>
</div>
<script>
'use strict';
/* =====================================================================
   MINERAÇÃO DE BITCOIN — vídeo vertical 1080x1920 renderizado em Canvas
   Tudo é desenhado por código; todo o tempo é derivado de um único
   relógio (AudioContext.currentTime), então cenas, sons e legendas
   ficam sincronizados no mesmo timestamp.
   ===================================================================== */
const W = 1080, H = 1920, FPS = 60, DURATION = 48;
const FOCUS_X = 540, FOCUS_Y = 780;            // ponto da tela onde a câmera centraliza
const T_ZOOM = 46.85, T_END_CUT = 47.2;         // zoom final e corte de volta à cena 1 (loop)
const TAU = Math.PI * 2;
const FONT = 'Montserrat, "Arial Black", "Helvetica Neue", Arial, sans-serif';
const MONO = '"JetBrains Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace';
const C = {
  bg:'#121212', ink:'#F4F1EA', inkBack:'#A9A49B', yellow:'#FFE600', gold:'#F7B500', goldL:'#FFD84D',
  red:'#FF3B3B', green:'#22E07A', cyan:'#38D6FF', orange:'#FF8A1F', pink:'#FF4FD8', purple:'#8B5CFF',
  steel:'#C9D1D9', steelD:'#6B7380', dark:'#1C1F25'
};

/* ---------------------------- ROTEIRO ---------------------------- */
const SCENES = [
  { title:'O GANCHO',          start:0,  end:4,  accent:'#FF3B3B',
    text:'Minerar Bitcoin não tem nada a ver com cavar moedas digitais: na verdade, você está participando da loteria mais difícil e cara do planeta.' },
  { title:'O LIVRO-RAZÃO',     start:4,  end:12, accent:'#38D6FF',
    text:'Toda vez que alguém envia Bitcoin, essa transferência entra numa caixa transparente chamada bloco, que funciona como uma página de um livro contábil público.' },
  { title:'A LOTERIA DO HASH', start:12, end:22, accent:'#8B5CFF',
    text:'Para lacrar essa página e evitar fraudes, os computadores precisam adivinhar um código criptográfico absurdo na base da força bruta, testando trilhões de senhas por segundo.' },
  { title:'GUERRA DE ENERGIA', start:22, end:32, accent:'#FF8A1F',
    text:'Isso não exige inteligência, exige força bruta: máquinas especiais gastam a energia de cidades inteiras numa corrida insana para achar a senha certa em dez minutos.' },
  { title:'PROVA DE TRABALHO', start:32, end:42, accent:'#22E07A',
    text:'O primeiro computador do mundo que acerta o código avisa a rede, todo mundo confere em um segundo e o bloco é acorrentado para sempre na Blockchain.' },
  { title:'A RECOMPENSA',      start:42, end:48, accent:'#F7B500',
    text:'Como pagamento por gastar toda essa energia protegendo a rede, o sistema cria Bitcoins novinhos do zero e entrega para o vencedor, provando que...' }
];

/* ---------------------------- UTILITÁRIOS ---------------------------- */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
function rnd(i) { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
function noise1(x) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(rnd(i), rnd(i + 1), u) * 2 - 1; }
const E = {
  inQuad: t => t * t,
  outQuad: t => 1 - (1 - t) * (1 - t),
  inCubic: t => t * t * t,
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inOutCubic: t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outBack: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  inBack: t => { const c1 = 1.70158, c3 = c1 + 1; return c3 * t * t * t - c1 * t * t; },
  outElastic: t => t <= 0 ? 0 : t >= 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (TAU / 3)) + 1,
  outBounce: t => { const n = 7.5625, d = 2.75;
    if (t < 1 / d) return n * t * t;
    if (t < 2 / d) { t -= 1.5 / d; return n * t * t + 0.75; }
    if (t < 2.5 / d) { t -= 2.25 / d; return n * t * t + 0.9375; }
    t -= 2.625 / d; return n * t * t + 0.984375; }
};
/* escala de entrada (elástica) e saída (inBack) de um elemento */
function appear(lt, t0, t1 = Infinity, din = 0.65, dout = 0.28, ease = E.outElastic) {
  if (lt < t0) return 0;
  let v = ease(clamp((lt - t0) / din, 0, 1));
  if (lt > t1) { const p = clamp((lt - t1) / dout, 0, 1); if (p >= 1) return 0; v *= 1 - E.inBack(p); }
  return Math.max(0, v);
}
const _rgb = {};
function rgba(hex, a) {
  let c = _rgb[hex];
  if (!c) { const n = parseInt(hex.slice(1), 16); c = _rgb[hex] = [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
  return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
}
function mix(h1, h2, t) {
  rgba(h1, 1); rgba(h2, 1); const a = _rgb[h1], b = _rgb[h2];
  return `rgb(${Math.round(lerp(a[0], b[0], t))},${Math.round(lerp(a[1], b[1], t))},${Math.round(lerp(a[2], b[2], t))})`;
}
function fmtBig(n) {
  const s = Math.floor(n).toString(); let out = '';
  for (let i = 0; i < s.length; i++) { if (i && (s.length - i) % 3 === 0) out += '.'; out += s[i]; }
  return out;
}
const HEX = '0123456789abcdef';
function hexStr(seed, len) { let s = ''; for (let i = 0; i < len; i++) s += HEX[Math.floor(rnd(seed * 13.37 + i * 7.91) * 16)]; return s; }

/* ---------------------------- LEGENDAS (palavra a palavra) ---------------------------- */
const WORDS = [], PAGES = [];
function buildCaptions() {
  SCENES.forEach((sc, si) => {
    const raw = sc.text.split(/\s+/).filter(Boolean);
    const a = sc.start + (si === 0 ? 0.05 : 0.15), b = sc.end - 0.15;
    const wts = raw.map(w => w.replace(/[^\p{L}\p{N}]/gu, '').length + 2.2 + (/[,:;]$/.test(w) ? 2.5 : /[.!?…]$/.test(w) ? 3 : 0));
    const tot = wts.reduce((p, c) => p + c, 0);
    let acc = a; const list = [];
    raw.forEach((w, i) => {
      const d = (b - a) * wts[i] / tot;
      const o = { text: w, disp: w.toUpperCase(), t0: acc, t1: acc + d, scene: si };
      WORDS.push(o); list.push(o); acc += d;
    });
    let cur = [], chars = 0;
    const flush = () => { if (cur.length) { PAGES.push({ words: cur, scene: si }); cur = []; chars = 0; } };
    list.forEach(o => {
      if (cur.length && (cur.length >= 4 || chars + o.text.length > 20)) flush();
      cur.push(o); chars += o.text.length;
      if (/[,:;.!?…]$/.test(o.text)) flush();
    });
    flush();
  });
  PAGES.forEach((p, i) => {
    p.t0 = p.words[0].t0;
    const nx = PAGES[i + 1];
    p.t1 = nx && nx.scene === p.scene ? nx.words[0].t0 : SCENES[p.scene].end;
  });
}
const normW = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]/g, '');
/* instante (s) em que uma palavra da narração começa — usado para sincronizar animações */
function wt(si, word) {
  const n = normW(word);
  const w = WORDS.find(o => o.scene === si && normW(o.text).startsWith(n));
  return w ? w.t0 : SCENES[si].start;
}
const K = {};
function buildKeys() {
  Object.assign(K, {
    loteria: wt(0, 'loteria'), cara: wt(0, 'cara'),
    envia: wt(1, 'envia'), transf: wt(1, 'transferência'), caixa: wt(1, 'caixa'), bloco: wt(1, 'bloco'),
    pagina: wt(1, 'página'), publico: wt(1, 'público'),
    lacrar: wt(2, 'lacrar'), fraudes: wt(2, 'fraudes'), computadores: wt(2, 'computadores'),
    cripto: wt(2, 'criptográfico'), forca3: wt(2, 'força'), trilhoes: wt(2, 'trilhões'),
    intel: wt(3, 'inteligência'), forca4: wt(3, 'força'), maquinas: wt(3, 'máquinas'), gastam: wt(3, 'gastam'),
    cidades: wt(3, 'cidades'), corrida: wt(3, 'corrida'), dez: wt(3, 'dez'),
    mundo: wt(4, 'mundo'), avisa: wt(4, 'avisa'), confere: wt(4, 'confere'), segundo: wt(4, 'segundo'),
    acorrentado: wt(4, 'acorrentado'), sempre: wt(4, 'sempre'), blockchain: wt(4, 'blockchain'),
    protegendo: wt(5, 'protegendo'), cria: wt(5, 'cria'), novinhos: wt(5, 'novinhos')
  });
}

/* =====================================================================
   ÁUDIO — efeitos 100% sintéticos (Web Audio API), sem arquivos externos
   ===================================================================== */
function createAudioFX() {
  let ac = null, out = null, sfx = null, music = null, rec = null, nb = null;
  /* given: contexto opcional (ex.: OfflineAudioContext para exportação offline) */
  function init(given) {
    if (ac) return ac;
    if (given) ac = given;
    else {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ac = new AC({ latencyHint: 'interactive' });
    }
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 12; comp.ratio.value = 5; comp.attack.value = 0.003; comp.release.value = 0.2;
    out = ac.createGain(); out.gain.value = 0.72; out.connect(comp); comp.connect(ac.destination);
    if (ac.createMediaStreamDestination) { rec = ac.createMediaStreamDestination(); comp.connect(rec); }
    sfx = ac.createGain(); sfx.gain.value = 1; sfx.connect(out);
    music = ac.createGain(); music.gain.value = 0.55; music.connect(out);
    nb = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const d = nb.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return ac;
  }
  function tone({ type = 'sine', f = 440, f2 = null, when, dur = 0.2, gain = 0.3, attack = 0.005, bus = sfx, filter = null }) {
    attack = Math.min(attack, dur * 0.9);
    const o = ac.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(f, when);
    if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(1, f2), when + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, when);
    g.gain.exponentialRampToValueAtTime(gain, when + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    let node = o;
    if (filter) { const fl = ac.createBiquadFilter(); fl.type = filter.type; fl.frequency.value = filter.f; fl.Q.value = filter.Q || 0.7; o.connect(fl); node = fl; }
    node.connect(g); g.connect(bus); o.start(when); o.stop(when + dur + 0.05);
  }
  function noise({ when, dur = 0.3, gain = 0.3, type = 'bandpass', f = 1000, f2 = null, Q = 1, attack = 0.01, bus = sfx }) {
    attack = Math.min(attack, dur * 0.9);
    const s = ac.createBufferSource(); s.buffer = nb; s.loop = true;
    const fl = ac.createBiquadFilter(); fl.type = type; fl.Q.value = Q;
    fl.frequency.setValueAtTime(f, when);
    if (f2) fl.frequency.exponentialRampToValueAtTime(f2, when + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, when);
    g.gain.exponentialRampToValueAtTime(gain, when + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    s.connect(fl); fl.connect(g); g.connect(bus);
    s.start(when, Math.random() * 1.5); s.stop(when + dur + 0.05);
  }
  const S = {
    pop(w, p = 1) { tone({ f: 700 * p, f2: 160 * p, when: w, dur: 0.12, gain: 0.5 }); tone({ type: 'triangle', f: 1400 * p, f2: 500 * p, when: w, dur: 0.05, gain: 0.15 }); },
    swoosh(w, dur = 0.35, rev = false) { noise({ when: w, dur, gain: 0.32, f: rev ? 5000 : 350, f2: rev ? 400 : 5200, Q: 1.4, attack: dur * 0.55 }); },
    bip(w, f = 1200, dur = 0.07, g = 0.12) { tone({ type: 'square', f, when: w, dur, gain: g, attack: 0.003, filter: { type: 'lowpass', f: 6000 } }); },
    blip(w, f = 900) { tone({ f, f2: f * 1.5, when: w, dur: 0.08, gain: 0.22, attack: 0.003 }); },
    tick(w, f = 2400) { tone({ type: 'square', f, when: w, dur: 0.025, gain: 0.06, attack: 0.001 }); noise({ when: w, dur: 0.02, gain: 0.07, type: 'highpass', f: 4000, attack: 0.001 }); },
    metal(w, base = 1, g = 0.35, decay = 0.9) {
      [1, 2.76, 5.4, 8.93, 13.3].forEach((m, i) => tone({ f: 310 * base * m, when: w, dur: decay / (1 + i * 0.6), gain: g / (1 + i * 0.7), attack: 0.002 }));
      noise({ when: w, dur: 0.06, gain: 0.3, f: 3500, Q: 0.8, attack: 0.002 });
    },
    lock(w) { S.metal(w, 1.25, 0.45, 1.1); tone({ f: 140, f2: 45, when: w, dur: 0.3, gain: 0.8, attack: 0.003 }); S.tick(w + 0.09, 1800); S.metal(w + 0.1, 1.9, 0.18, 0.35); },
    clank(w, p = 1) { S.metal(w, p, 0.3, 0.45); tone({ type: 'triangle', f: 220 * p, f2: 90, when: w, dur: 0.12, gain: 0.3 }); },
    thud(w, g = 0.7) { tone({ f: 150, f2: 40, when: w, dur: 0.28, gain: g, attack: 0.002 }); noise({ when: w, dur: 0.12, gain: 0.25, type: 'lowpass', f: 900, attack: 0.002 }); },
    boom(w) {
      noise({ when: w, dur: 1.4, gain: 0.9, type: 'lowpass', f: 1600, f2: 80, Q: 0.6, attack: 0.004 });
      tone({ f: 110, f2: 28, when: w, dur: 0.9, gain: 0.9, attack: 0.003 });
      noise({ when: w, dur: 0.25, gain: 0.5, type: 'highpass', f: 2000, attack: 0.002 });
    },
    buzzer(w, dur = 0.5) {
      for (let i = 0; i < 3; i++) {
        tone({ type: 'sawtooth', f: 105, when: w + i * dur / 3, dur: dur / 3 * 0.85, gain: 0.22, filter: { type: 'lowpass', f: 1400 } });
        tone({ type: 'square', f: 111, when: w + i * dur / 3, dur: dur / 3 * 0.85, gain: 0.1, filter: { type: 'lowpass', f: 1000 } });
      }
    },
    ding(w, p = 1) { [1046.5, 1318.5, 1568, 2093].forEach((f, i) => tone({ type: 'triangle', f: f * p, when: w + i * 0.07, dur: 0.5, gain: 0.22, attack: 0.004 })); tone({ f: 4186 * p, when: w + 0.28, dur: 0.6, gain: 0.06 }); },
    coin(w, p = 1) {
      tone({ type: 'square', f: 988 * p, when: w, dur: 0.07, gain: 0.07, attack: 0.002, filter: { type: 'lowpass', f: 5000 } });
      tone({ type: 'square', f: 1319 * p, when: w + 0.06, dur: 0.32, gain: 0.07, attack: 0.002, filter: { type: 'lowpass', f: 5000 } });
    },
    coins(w, n = 6) {
      for (let i = 0; i < n; i++) {
        const o = Math.random() * 0.35;
        tone({ f: 2600 + Math.random() * 2200, when: w + o, dur: 0.14, gain: 0.12, attack: 0.001 });
        tone({ f: 5200 + Math.random() * 1500, when: w + o, dur: 0.08, gain: 0.05, attack: 0.001 });
      }
    },
    kaching(w) { S.metal(w, 2.2, 0.18, 0.3); tone({ f: 1568, when: w + 0.08, dur: 0.9, gain: 0.25 }); tone({ f: 2093, when: w + 0.08, dur: 1.0, gain: 0.18 }); S.coins(w + 0.05, 10); },
    stamp(w) { S.thud(w, 0.9); noise({ when: w, dur: 0.18, gain: 0.35, f: 600, Q: 0.7, attack: 0.002 }); },
    zap(w, dur = 0.3) {
      tone({ type: 'sawtooth', f: 1800, f2: 120, when: w, dur, gain: 0.18, attack: 0.003, filter: { type: 'bandpass', f: 2000, Q: 0.8 } });
      noise({ when: w, dur, gain: 0.2, type: 'highpass', f: 3000, attack: 0.002 });
    },
    riser(w, dur = 2) {
      tone({ type: 'sawtooth', f: 180, f2: 1400, when: w, dur, gain: 0.1, attack: dur * 0.9, filter: { type: 'lowpass', f: 2500 } });
      noise({ when: w, dur, gain: 0.12, f: 500, f2: 6000, Q: 2, attack: dur * 0.9 });
    },
    fan(w, dur = 10) {
      const s = ac.createBufferSource(); s.buffer = nb; s.loop = true;
      const fl = ac.createBiquadFilter(); fl.type = 'bandpass'; fl.Q.value = 0.9;
      fl.frequency.setValueAtTime(300, w); fl.frequency.linearRampToValueAtTime(1300, w + dur);
      const g = ac.createGain(); g.gain.setValueAtTime(0.0001, w); g.gain.exponentialRampToValueAtTime(0.06, w + 0.6);
      g.gain.linearRampToValueAtTime(0.2, w + dur - 0.3); g.gain.exponentialRampToValueAtTime(0.0001, w + dur);
      s.connect(fl); fl.connect(g); g.connect(sfx); s.start(w); s.stop(w + dur + 0.1);
      const o = ac.createOscillator(); o.type = 'sawtooth';
      o.frequency.setValueAtTime(48, w); o.frequency.linearRampToValueAtTime(95, w + dur);
      const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 320;

  for (let i = 0; i < IMP.length; i++) {
    const s = IMP[i], a = t - s.t; if (a < 0 || a > s.dur) continue;
    const k = Math.pow(1 - a / s.dur, 2) * s.amp;
    x += noise1(t * 38 + i * 13.1) * k; y += noise1(t * 41 + i * 7.7 + 50) * k; r += noise1(t * 30 + i * 3.3 + 99) * k * 0.0016;
  }
  return { x, y, r };
}
function drawBackground(c, t, accent) {
  c.fillStyle = C.bg; c.fillRect(0, 0, W, H);
  const g = c.createRadialGradient(540, 820, 60, 540, 820, 1150);
  g.addColorStop(0, rgba(accent, 0.16)); g.addColorStop(1, rgba(accent, 0));
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  const sp = 90, ox = (t * 14) % sp, oy = (t * 22) % sp;
  c.strokeStyle = 'rgba(255,255,255,0.05)'; c.lineWidth = 2; c.beginPath();
  for (let x = ox - sp; x < W + sp; x += sp) { c.moveTo(x, 0); c.lineTo(x, H); }
  for (let y = oy - sp; y < H + sp; y += sp) { c.moveTo(0, y); c.lineTo(W, y); }
  c.stroke();
  for (let i = 0; i < 26; i++) {
    const x = ((rnd(i) * W + t * (10 + rnd(i + 50) * 25)) % W + W) % W;
    const y = ((rnd(i + 100) * H - t * (14 + rnd(i + 200) * 30)) % H + H) % H;
    c.fillStyle = `rgba(255,255,255,${0.06 + rnd(i + 400) * 0.12})`; circle(c, x, y, 2 + rnd(i + 300) * 3); c.fill();
  }
}
function drawVignette(c) {
  const v = c.createRadialGradient(540, 900, 620, 540, 900, 1250);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.55)');
  c.fillStyle = v; c.fillRect(0, 0, W, H);
}
function drawHUD(c, t, si, lt) {
  c.fillStyle = 'rgba(255,255,255,0.12)'; c.fillRect(0, 0, W, 12);
  c.fillStyle = C.yellow; c.fillRect(0, 0, W * clamp(t / DURATION, 0, 1), 12);
  c.fillStyle = C.bg; for (const s of SCENES) if (s.start > 0) c.fillRect(W * s.start / DURATION - 2, 0, 4, 12);
  let ti = si, tl = lt;
  if (si === 5 && t >= T_END_CUT) { ti = 0; tl = t - T_END_CUT; } else if (si === 0) tl = lt + 1;
  const sc = SCENES[ti], p = appear(tl, 0, Infinity, 0.7);
  if (p <= 0) return;
  c.save(); c.translate(540, 196); c.scale(p, p); c.rotate(Math.sin(t * 2.2) * 0.015);
  c.font = `900 50px ${FONT}`; const tw = c.measureText(sc.title).width, w = tw + 150;
  c.fillStyle = 'rgba(0,0,0,0.5)'; rr(c, -w / 2 + 6, -38, w, 84, 42); c.fill();
  c.fillStyle = '#0D0D0F'; rr(c, -w / 2, -44, w, 84, 42); c.fill(); c.strokeStyle = sc.accent; c.lineWidth = 5; c.stroke();
  c.fillStyle = sc.accent; circle(c, -w / 2 + 44, -2, 30); c.fill();
  txt(c, String(ti + 1), -w / 2 + 44, 0, { size: 36, color: '#111' });
  txt(c, sc.title, 34, 0, { size: 50, color: C.ink });
  c.restore();
}
function drawCaptions(c, t) {
  const page = PAGES.find(p => t >= p.t0 && t < p.t1) || (t >= DURATION - 0.001 ? PAGES[PAGES.length - 1] : null);
  if (!page) return;
  const fs = 76, sp = fs * 0.3, maxW = 960;
  c.font = `900 ${fs}px ${FONT}`; c.textBaseline = 'middle'; c.textAlign = 'center';
  let active = null; for (const o of page.words) if (t >= o.t0) active = o;
  const ws = page.words.map(w => { const k = w === active ? E.outBack(clamp((t - w.t0) / 0.14, 0, 1)) : 0, s = 1 + 0.16 * k, px = c.measureText(w.disp).width; return { w, k, s, px, bw: px * s }; });
  const lines = []; let cur = [], cw = 0;
  for (const o of ws) { if (cur.length && cw + sp + o.px > maxW) { lines.push({ ws: cur, w: cw }); cur = []; cw = 0; } cw += (cur.length ? sp : 0) + o.bw; cur.push(o); }
  if (cur.length) lines.push({ ws: cur, w: cw });
  const lh = fs * 1.14, pp = E.outBack(clamp((t - page.t0) / 0.18, 0, 1)), ps = 0.82 + 0.18 * pp;
  c.save(); c.translate(540, 1500); c.scale(ps, ps);
  lines.forEach((ln, li) => {
    let x = -ln.w / 2; const y = (li - (lines.length - 1) / 2) * lh;
    for (const o of ln.ws) {
      const isA = o.w === active, s = o.s, cx = x + o.bw / 2;
      c.save(); c.translate(cx, y); c.scale(s, s); c.rotate(isA ? -0.03 : 0);
      c.fillStyle = 'rgba(0,0,0,0.6)'; c.fillText(o.w.disp, 0, 8);
      c.lineJoin = 'round'; c.lineWidth = 15; c.strokeStyle = '#000'; c.strokeText(o.w.disp, 0, 0);
      c.fillStyle = isA ? C.yellow : t >= o.w.t0 ? '#FFFFFF' : 'rgba(255,255,255,0.6)'; c.fillText(o.w.disp, 0, 0);
      c.restore();
      x += o.bw + sp;
    }
  });
  c.restore();
}
function drawFlashes(c, t) {
  for (const f of FLS) { const a = t - f.t; if (a >= 0 && a < f.dur) { c.fillStyle = rgba(f.color, f.a * (1 - a / f.dur)); c.fillRect(0, 0, W, H); } }
}
function render(t) {
  t = clamp(t, 0, DURATION - 1e-4);
  const si = sceneAt(t), sc = SCENES[si], fx = SCENE_FX[si], lt = t - sc.start;
  const accent = (si === 5 && t >= T_END_CUT) ? SCENES[0].accent : sc.accent;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  drawBackground(ctx, t, accent);
  const cam = fx.cam(lt, t), sh = shakeAt(t);
  const punch = si > 0 ? 1 + 0.12 * (1 - E.outCubic(clamp(lt / 0.35, 0, 1))) : 1;
  ctx.save();
  ctx.translate(FOCUS_X + sh.x, FOCUS_Y + sh.y); ctx.rotate(cam.r + sh.r); ctx.scale(cam.z * punch, cam.z * punch); ctx.translate(-cam.x, -cam.y);
  fx.draw(ctx, lt, t);
  ctx.restore();
  if (fx.overlay) { ctx.save(); ctx.translate(sh.x * 0.5, sh.y * 0.5); fx.overlay(ctx, lt, t); ctx.restore(); }
  drawVignette(ctx);
  drawFlashes(ctx, t);
  ctx.save(); ctx.translate(sh.x * 0.3, sh.y * 0.3); drawHUD(ctx, t, si, lt); drawCaptions(ctx, t); ctx.restore();
}

/* =====================================================================
   NARRAÇÃO OPCIONAL (Web Speech API)
   ===================================================================== */
const Speech = {
  ok: 'speechSynthesis' in window, voice: null,
  pick() {
    if (!this.ok) return;
    const vs = speechSynthesis.getVoices();
    this.voice = vs.find(v => /pt[-_]BR/i.test(v.lang) && /google|natural|neural|francisca|luciana|thalita/i.test(v.name))
      || vs.find(v => /pt[-_]BR/i.test(v.lang)) || vs.find(v => /^pt/i.test(v.lang)) || null;
  },
  speak(sc) {
    if (!this.ok) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(sc.text.replace(/\.\.\.$/, '…'));
    u.lang = 'pt-BR'; if (this.voice) u.voice = this.voice;
    u.rate = clamp((sc.text.length / 14.5) / ((sc.end - sc.start) * 0.94), 0.9, 2.4); u.pitch = 1.05; u.volume = 1;
    speechSynthesis.speak(u);
  },
  stop() { if (this.ok) speechSynthesis.cancel(); },
  pause() { if (this.ok) speechSynthesis.pause(); },
  resume() { if (this.ok) speechSynthesis.resume(); }
};
if (Speech.ok) { Speech.pick(); speechSynthesis.onvoiceschanged = () => Speech.pick(); }

/* =====================================================================
   RELÓGIO, AGENDADOR E LOOP PRINCIPAL (requestAnimationFrame)
   ===================================================================== */
const Clock = {
  useAudio: false, t0: 0, pausedAt: null,
  now() { const ac = AudioFX.ctx; return this.useAudio && ac ? ac.currentTime : performance.now() / 1000; },
  start(delay = 0.15) { const ac = AudioFX.ctx; this.useAudio = !!ac && ac.state === 'running'; this.t0 = this.now() + delay; this.pausedAt = null; },
  time() { return (this.pausedAt != null ? this.pausedAt : this.now()) - this.t0; },
  pause() { if (this.pausedAt == null) this.pausedAt = this.now(); },
  resume() { if (this.pausedAt != null) { this.t0 += this.now() - this.pausedAt; this.pausedAt = null; } },
  toPerf() { const t = this.time(); this.useAudio = false; this.t0 = performance.now() / 1000 - t; }
};
const opts = { voice: false, music: true, loop: false };
const state = { started: false, ended: false, paused: false, recording: false, preview: null, evIdx: 0, lastScene: -1 };
let recorder = null, recChunks = [], recMime = '';

function scheduleAudio(t) {
  const ac = AudioFX.ctx;
  if (!ac || !Clock.useAudio || ac.state !== 'running') { while (state.evIdx < EV.length && EV[state.evIdx].t <= t) state.evIdx++; return; }
  while (state.evIdx < EV.length && EV[state.evIdx].t <= t + 0.12) {
    const e = EV[state.evIdx++];
    if (e.t < t - 0.06 || (e.music && !opts.music)) continue;
    try { AudioFX.S[e.n](Math.max(Clock.t0 + e.t, ac.currentTime), ...e.a); } catch (err) { console.warn('som', e.n, err); }
  }
}
function handleSpeech(t) {
  const si = sceneAt(t);
  if (si !== state.lastScene) {
    state.lastScene = si;
    if (opts.voice && t - SCENES[si].start < 0.5) Speech.speak(SCENES[si]);
  }
}
const $ = id => document.getElementById(id);
const dbg = new URLSearchParams(location.search).has('debug');
function frame() {
  requestAnimationFrame(frame);
  let t;
  if (state.preview != null) t = state.preview;
  else if (!state.started) t = 0;
  else {
    const ac = AudioFX.ctx;
    if (Clock.useAudio && (!ac || ac.state !== 'running') && !state.paused) Clock.toPerf();
    t = Clock.time();
    if (t >= DURATION && !state.ended) {
      if (opts.loop && !state.recording) { restartPlayback(0); t = Clock.time(); }
      else finish();
    }
    if (!state.ended && !state.paused && t >= 0) { scheduleAudio(t); handleSpeech(t); }
  }
  render(Math.max(0, t));
  if (dbg) $('dbg').textContent = `t=${Math.max(0, t).toFixed(2)}s  cena ${sceneAt(Math.max(0, t)) + 1}`;
}
async function ensureAudio() {
  const ac = AudioFX.init();
  if (ac && ac.state !== 'running') { try { await ac.resume(); } catch (e) { console.warn(e); } }
  AudioFX.setMusic(opts.music);
  return ac;
}
function readOpts() { opts.voice = $('optVoice').checked && Speech.ok; opts.music = $('optMusic').checked; opts.loop = $('optLoop').checked; }
function restartPlayback(delay = 0.15) {
  Speech.stop(); Clock.start(delay);
  state.started = true; state.ended = false; state.paused = false; state.evIdx = 0; state.lastScene = -1;
  $('startOv').classList.add('hidden'); $('endOv').classList.add('hidden');
}
async function startPlayback() { readOpts(); await ensureAudio(); restartPlayback(); }
function finish() {
  state.ended = true; Speech.stop();
  if (state.recording && recorder) { setTimeout(() => { try { recorder.stop(); } catch (e) { } }, 200); }
  $('endOv').classList.remove('hidden');
}
async function togglePause() {
  if (!state.started || state.ended || state.recording) return;
  const ac = AudioFX.ctx;
  if (!state.paused) { state.paused = true; Clock.pause(); Speech.pause(); if (ac && Clock.useAudio) await ac.suspend(); }
  else { if (ac && Clock.useAudio) await ac.resume(); Clock.resume(); Speech.resume(); state.paused = false; }
}
async function startRecording() {
  if (!window.MediaRecorder || !canvas.captureStream) { $('recInfo').textContent = 'Este navegador não suporta gravação (MediaRecorder). Use Chrome, Edge ou Firefox atualizados.'; $('endOv').classList.remove('hidden'); return; }
  readOpts(); await ensureAudio();
  const tracks = [...canvas.captureStream(FPS).getVideoTracks()];
  if (AudioFX.recStream) tracks.push(...AudioFX.recStream.getAudioTracks());
  const types = ['video/mp4;codecs=avc1.640028,mp4a.40.2', 'video/mp4;codecs=avc1,mp4a', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm', 'video/mp4'];
  recMime = types.find(x => MediaRecorder.isTypeSupported(x)) || '';
  recorder = new MediaRecorder(new MediaStream(tracks), recMime ? { mimeType: recMime, videoBitsPerSecond: 16000000, audioBitsPerSecond: 192000 } : undefined);
  recChunks = [];
  recorder.ondataavailable = e => { if (e.data && e.data.size) recChunks.push(e.data); };
  recorder.onstop = () => {
    state.recording = false; $('rec').classList.add('hidden');
    const type = recorder.mimeType || recMime || 'video/webm', ext = type.includes('mp4') ? 'mp4' : 'webm';
    const url = URL.createObjectURL(new Blob(recChunks, { type }));
    const a = $('dl'); a.href = url; a.download = `mineracao-bitcoin-9x16.${ext}`; a.classList.remove('hidden');
    $('recInfo').textContent = `Arquivo .${ext} pronto (1080×1920). ` + (ext === 'webm' ? 'Para MP4: ffmpeg -i mineracao-bitcoin-9x16.webm -c:v libx264 -pix_fmt yuv420p -r 60 -c:a aac mineracao.mp4' : '');
    a.click();
  };
  state.recording = true; $('rec').classList.remove('hidden'); $('dl').classList.add('hidden'); $('recInfo').textContent = '';
  recorder.start(250);
  restartPlayback(0.25);
}

/* ---------------------------- INTERFACE ---------------------------- */
$('btnStart').addEventListener('click', startPlayback);
$('btnAgain').addEventListener('click', startPlayback);
$('btnRec').addEventListener('click', startRecording);
$('btnRec2').addEventListener('click', startRecording);
$('optMusic').addEventListener('change', e => { opts.music = e.target.checked; AudioFX.setMusic(opts.music); });
document.addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); if (!state.started) startPlayback(); else togglePause(); }
  else if (e.key === 'r' || e.key === 'R') { if (!state.recording) startPlayback(); }
  else if (e.key === 'f' || e.key === 'F') { const el = $('stage'); if (!document.fullscreenElement) el.requestFullscreen && el.requestFullscreen(); else document.exitFullscreen(); }
});
document.addEventListener('visibilitychange', () => { if (document.hidden && state.recording) $('recInfo').textContent = 'Atenção: a aba ficou oculta durante a gravação; o vídeo pode ter travado.'; });

/* ---------------------------- INICIALIZAÇÃO ---------------------------- */
buildCaptions();
buildKeys();
buildTimeline();
window.__mining = { render, renderAudioOffline, DURATION, FPS, SCENES, PAGES, WORDS, K, EV };
(() => {
  const q = new URLSearchParams(location.search);
  if (q.has('t')) { state.preview = clamp(parseFloat(q.get('t')) || 0, 0, DURATION - 1e-4); $('startOv').classList.add('hidden'); }
  else if (q.has('autoplay')) { readOpts(); restartPlayback(0.05); }
  if (dbg) $('dbg').classList.remove('hidden');
  if (q.has('export')) { $('startOv').classList.add('hidden'); render(0); return; }   /* modo exportação: quadros sob demanda */
  if (document.fonts && document.fonts.load) Promise.all([document.fonts.load(`900 76px Montserrat`), document.fonts.load(`800 34px "JetBrains Mono"`)]).catch(() => { });
  requestAnimationFrame(frame);
})();
</script>
