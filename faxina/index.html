<style>
/* Layout: uma coluna estreita. Topo = fase e progresso; centro = uma missão, seu timer e seus passos; base fixa = Feito / Travei. */
:root {
  --bg: #e9efed;
  --surface: #f7faf9;
  --fg: #22313a;
  --muted: #56666f;
  --line: #cfdad7;
  --accent: #437567;
  --accent-ink: #f4faf8;
  --soft: #dbe7e3;
  --panic: #8f5a3c;
  --panic-soft: #f2e4db;
  --water: #3f7193;
  --water-soft: #dce8f0;
  --font-display: "Lexend", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141b1f; --surface: #1b252a; --fg: #dbe5e2; --muted: #93a4a9; --line: #2c3a40;
    --accent: #86bba9; --accent-ink: #11201b; --soft: #22322f;
    --panic: #d8a383; --panic-soft: #33261f; --water: #8db8d6; --water-soft: #1d2c37;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141b1f; --surface: #1b252a; --fg: #dbe5e2; --muted: #93a4a9; --line: #2c3a40;
  --accent: #86bba9; --accent-ink: #11201b; --soft: #22322f;
  --panic: #d8a383; --panic-soft: #33261f; --water: #8db8d6; --water-soft: #1d2c37;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 17px; line-height: 1.5;
}
#root { min-height: 100%; }
.app {
  max-width: 520px; margin: 0 auto; min-height: 100%;
  display: flex; flex-direction: column; gap: 18px;
  padding-block: 18px 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
button:disabled { cursor: not-allowed; opacity: .45; }

/* topo */
.top { display: flex; flex-direction: column; gap: 10px; }
.top-row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 12px; }
.eyebrow { font-family: var(--font-display); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.pct { font-family: var(--font-display); font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); }
.bar { height: 8px; border-radius: 99px; background: var(--soft); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .6s ease; }
.phases, .ph-labels { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.ph { height: 4px; border-radius: 99px; background: var(--line); }
.ph.done { background: var(--accent); }
.ph.now { background: var(--muted); }
.ph-labels { font-size: 11px; color: var(--muted); font-family: var(--font-display); }
.ph-labels span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 3px; }
.ph-labels .cur { color: var(--fg); font-weight: 500; }
.lock { width: 10px; height: 10px; flex: none; }

/* centro */
.stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; }
.kind { font-family: var(--font-display); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.kind.panic { color: var(--panic); }
.kind.water { color: var(--water); }
.mission {
  font-family: var(--font-display); font-weight: 400; font-size: clamp(23px, 6vw, 30px);
  line-height: 1.25; text-wrap: balance; margin: 0; max-width: 22ch;
}
.hint { color: var(--muted); font-size: 15px; max-width: 34ch; margin: 0; text-wrap: balance; }
.clock { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.ring { position: relative; width: 120px; max-width: 100%; aspect-ratio: 1; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .track { stroke: var(--soft); fill: none; }
.ring .arc { fill: none; stroke-linecap: round; transition: stroke-dashoffset .5s linear; }
.ring .time { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; }
.ring .digits { font-family: var(--font-display); font-weight: 300; font-size: 30px; font-variant-numeric: tabular-nums; }
.ring .sub { font-size: 11px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; font-family: var(--font-display); }
.ring.over .digits { color: var(--muted); }
.timer-tools { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.chip {
  border: 1px solid var(--line); background: transparent; border-radius: 99px;
  padding: 5px 14px; font-size: 14px; color: var(--muted);
}
.chip:hover { color: var(--fg); border-color: var(--muted); }

/* passo a passo */
.steps { list-style: none; margin: 0; padding: 0; width: 100%; display: flex; flex-direction: column; gap: 4px; }
.step {
  width: 100%; display: flex; gap: 12px; align-items: flex-start; text-align: left;
  padding: 8px 12px; border-radius: 14px; border: 1px solid transparent; background: transparent;
  color: var(--muted); font-size: 16px; line-height: 1.4;
}
.step .dot {
  flex: none; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--line);
  display: grid; place-items: center; font-family: var(--font-display); font-size: 13px; font-variant-numeric: tabular-nums;
}
.step .txt { min-width: 0; padding-top: 2px; }
.step.next { background: var(--surface); border-color: var(--line); color: var(--fg); }
.step.next .dot { border-color: var(--accent); color: var(--accent); }
.step.checked .txt { text-decoration: line-through; text-decoration-color: var(--line); }
.step.checked .dot { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tip { margin: 0; width: 100%; box-sizing: border-box; padding: 0 12px; text-align: left; font-size: 14px; color: var(--muted); }
.tip b { color: var(--accent); }
.tip.warn b { color: var(--panic); }

/* base fixa */
.actions {
  position: sticky; bottom: 0; z-index: 5;
  display: grid; grid-template-columns: 2fr 1fr; gap: 8px;
  padding-block: 16px calc(14px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(to bottom, transparent, var(--bg) 16px);
}
.actions .btn-quiet, .actions .btn-water { grid-column: 1 / -1; }
.btn-done {
  border: 0; border-radius: 18px; padding: 16px; background: var(--accent); color: var(--accent-ink);
  font-family: var(--font-display); font-weight: 500; font-size: 22px; letter-spacing: .01em;
}
.btn-done:hover:not(:disabled) { filter: brightness(1.06); }
.btn-done.ready { animation: ready 1.8s ease-in-out infinite; }
@keyframes ready {
  0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 50%, transparent); }
  50% { box-shadow: 0 0 0 9px color-mix(in srgb, var(--accent) 0%, transparent); }
}
.btn-panic {
  border: 1.5px solid var(--panic); border-radius: 18px; padding: 13px; background: var(--panic-soft); color: var(--panic);
  font-family: var(--font-display); font-weight: 500; font-size: 17px;
}
.btn-water { background: var(--water); }
.btn-quiet {
  border: 0; background: transparent; color: var(--muted); font-size: 15px; padding: 6px;
  text-decoration: underline; text-underline-offset: 4px; text-decoration-color: var(--line);
}
.btn-quiet:hover { color: var(--fg); }

.toast {
  position: fixed; z-index: 20; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 14px);
  transform: translateX(-50%); max-width: calc(100% - 32px); box-sizing: border-box;
  background: var(--fg); color: var(--bg); border-radius: 99px; padding: 8px 18px;
  font-family: var(--font-display); font-size: 14px; text-align: center; pointer-events: none;
  animation: toast-in .25s ease;
}
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, -6px); } to { opacity: 1; transform: translate(-50%, 0); } }

.glass { width: 60px; height: 82px; border: 3px solid var(--water); border-top: 0; border-radius: 0 0 14px 14px; position: relative; overflow: hidden; }
.glass i { position: absolute; left: 0; right: 0; bottom: 0; background: var(--water-soft); border-top: 3px solid var(--water); transition: height .5s linear; }

/* resumo */
.summary { display: flex; flex-direction: column; gap: 20px; padding-bottom: 28px; }
.summary h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(26px, 7vw, 34px); line-height: 1.2; margin: 0; text-wrap: balance; }
.summary .lede { margin: 0; color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat b { font-family: var(--font-display); font-weight: 500; font-size: 22px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); line-height: 1.3; }
.wins { display: flex; flex-direction: column; gap: 16px; }
.win-phase h2 { font-family: var(--font-display); font-weight: 500; font-size: 15px; margin: 0 0 6px; display: flex; justify-content: space-between; gap: 10px; }
.win-phase h2 small { font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
.win-phase ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.win-phase li { display: flex; gap: 10px; align-items: baseline; font-size: 15px; }
.win-phase li::before { content: "✓"; color: var(--accent); font-weight: 700; flex: none; }
.note { background: var(--soft); border-radius: 14px; padding: 14px 16px; margin: 0; }
.confirm { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: center; font-size: 14px; color: var(--muted); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>

    ],
    tasks: [
      { t: "Limpe a bancada e o fogão por cima.", m: 10,
        steps: [
          "Tire tudo de cima da bancada e ponha na mesa",
          "Esponja com detergente na bancada inteira",
          "No fogão, esfregue em volta das bocas sem tirar as grades",
          "Pano úmido em tudo e devolva as coisas para a bancada",
        ],
        w: "Bancada e fogão limpos" },
      { t: "Lave mais louça por 10 minutos.", m: 10,
        steps: [
          "Pegue a pilha que ficou no canto da bancada",
          "Mesma ordem: copos, talheres, pratos, panelas",
          "Quando o timer tocar, pare, mesmo no meio",
        ],
        tip: "Dez minutos é o combinado. O que sobrar fica para amanhã, e tudo bem.",
        w: "Mais 10 minutos de louça lavada" },
      { t: "Dê o toque final no banheiro.", m: 5,
        steps: [
          "Molhe um papel, passe no espelho e seque com outro papel",
          "Pendure uma toalha de mão limpa",
          "Deixe um rolo de papel higiênico novo à vista",
        ],
        w: "Espelho limpo e banheiro abastecido" },
      { t: "Leve o lixo para fora.", m: 5,
        steps: [
          "Pegue dois sacos por vez",
          "Leve até a lixeira do prédio ou da rua",
          "Na volta, lave as mãos",
        ],
        tip: "Tarde demais para sair? Deixe os sacos fechados na porta e leve amanhã cedo.",
        w: "Lixo fora de casa" },
      { t: "Feche a casa e veja o que você fez.", m: 5,
        steps: [
          "Desvire as cadeiras",
          "Feche as janelas",
          "Apague a luz forte e acenda uma luz fraca",
          "Fique 30 segundos olhando a casa",
        ],
        w: "Casa fechada e vista com calma" },
    ],
  },
];

const PANIC_EXTRA = ["Ponha uma música e dance 30 segundos. Depois coloque 1 coisa no lugar."];
const PANIC_EASIER = [
  "Só levante. Fique em pé e conte até 10.",
  "Beba um copo de água em pé.",
  "Lave o rosto com água fria.",
  "Respire fundo 5 vezes, contando nos dedos.",
  "Bata palmas 10 vezes. Sério.",
  "Vá até o cômodo da missão e só fique lá dentro.",
  "Calce um chinelo. Só calçar.",
];

const FLAT = PHASES.flatMap((p, pi) => p.tasks.map((task) => ({ ...task, phase: pi })));
const MIN = 60000;
const TOTAL_MIN = FLAT.reduce((a, x) => a + x.m, 0);
const BREAK_EVERY = 45 * MIN;
const BREAK_MIN = 5;
const KEY = "faxina-resgate-v2";
const MODES = ["task", "panic", "break", "summary"];

const PHASE_DONE_MSG = [
  "Fase 1 feita. A emergência acabou.",
  "Fase 2 feita. Cama e sofá livres.",
  "Fase 3 feita. Banheiro e louça.",
  "O básico acabou. Fase 5 liberada.",
];
const CHEERS = ["Mais uma.", "Isso aí.", "Andou.", "Seguindo.", "Boa. Próxima.", "Conta como vitória.", "Uma de cada vez."];

const startTimer = (minutes) => ({ duration: minutes * MIN, remaining: minutes * MIN, endAt: Date.now() + minutes * MIN, chimed: false });
const timeLeft = (tm, now) => (tm.endAt ? tm.endAt - now : tm.remaining);
const note = (text) => ({ id: Date.now() + Math.random(), text });
const pick = (pool, last) => {
  const options = pool.filter((x) => x !== last);
  return options[Math.floor(Math.random() * options.length)] || pool[0];
};

function fresh() {
  return {
    mode: "task", idx: 0, checks: [],
    panicText: "", panicLevel: 1,
    timer: startTimer(FLAT[0].m),
    done: [], panicWins: 0, breaks: 0, cheer: 0,
    workMs: 0, sinceBreakMs: 0, prevMode: "task", toast: null, finished: false,
  };
}

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return fresh();
    const s = JSON.parse(raw);
    if (!s || typeof s.idx !== "number" || s.idx < 0 || s.idx >= FLAT.length || !s.timer || !MODES.includes(s.mode)) return fresh();
    return { ...fresh(), ...s, toast: null };
  } catch (e) { return fresh(); }
}

/* ---------- som suave ---------- */
let audioCtx = null;
function unlockAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
  } catch (e) {}
}
function chime() {
  try {
    if (!audioCtx) return;
    [523.25, 659.25].forEach((f, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = "sine"; o.frequency.value = f;
      const t0 = audioCtx.currentTime + i * 0.35;
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(0.18, t0 + 0.05);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.4);
      o.connect(g).connect(audioCtx.destination); o.start(t0); o.stop(t0 + 1.5);
    });
  } catch (e) {}
}

/* ---------- formatos ---------- */
const fmt = (ms) => {
  const over = ms < 0;
  const s = over ? Math.floor(-ms / 1000) : Math.ceil(ms / 1000);
  return (over ? "+" : "") + Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
};
const fmtDur = (ms) => {
  const m = Math.round(ms / MIN);
  if (m < 60) return m + " min";
  return Math.floor(m / 60) + "h" + (m % 60 ? String(m % 60).padStart(2, "0") : "");
};
const fmtClock = (ts) => {
  try { return new Date(ts).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }); }
  catch (e) { const d = new Date(ts); return d.getHours() + ":" + String(d.getMinutes()).padStart(2, "0"); }
};

// previsão de fim: missões que faltam + pausas de água que ainda vão acontecer
function estimateEnd(s, now) {
  const left = Math.max(0, timeLeft(s.timer, now));
  const fromIdx = s.mode === "task" ? s.idx + 1 : s.idx;
  const rest = FLAT.slice(fromIdx).reduce((a, x) => a + x.m * MIN, 0);
  const work = rest + (s.mode === "break" ? 0 : left);
  const since = s.mode === "break" ? 0 : s.sinceBreakMs;
  const breaks = Math.max(0, Math.floor((since + work - 1) / BREAK_EVERY));
  return now + (s.mode === "break" ? left : 0) + work + breaks * BREAK_MIN * MIN;
}

/* ---------- componentes ---------- */
function Ring({ tm, now, color, label }) {
  const left = timeLeft(tm, now);
  const frac = Math.max(0, Math.min(1, left / tm.duration));
  const r = 62, c = 2 * Math.PI * r;
  const over = left <= 0;
  return (
    <div className={"ring" + (over ? " over" : "")} role="timer" aria-label={over ? "Tempo esgotado" : "Faltam " + fmt(left)}>
      <svg viewBox="0 0 140 140" aria-hidden="true">
        <circle className="track" cx="70" cy="70" r={r} strokeWidth="7" />
        <circle className="arc" cx="70" cy="70" r={r} strokeWidth="7" stroke={color}
          strokeDasharray={c} strokeDashoffset={c * (1 - frac)} />
      </svg>
      <div className="time">
        <span className="digits">{fmt(left)}</span>
        <span className="sub">{over ? "tempo extra" : tm.endAt ? label : "pausado"}</span>
      </div>
    </div>
  );
}

function Steps({ steps, checks, onToggle }) {
  const next = steps.findIndex((_, i) => !checks.includes(i));
  return (
    <ol className="steps" aria-label="Passo a passo">
      {steps.map((st, i) => {
        const checked = checks.includes(i);
        const cls = "step" + (checked ? " checked" : "") + (i === next ? " next" : "");
        return (
          <li key={i}>
            <button type="button" className={cls} aria-pressed={checked} onClick={() => onToggle(i)}>
              <span className="dot" aria-hidden="true">{checked ? "✓" : i + 1}</span>
              <span className="txt">{st}</span>
            </button>
          </li>
        );
      })}
    </ol>
  );
}

const Lock = () => (
  <svg className="lock" viewBox="0 0 12 12" aria-hidden="true">
    <rect x="2" y="5.5" width="8" height="5.5" rx="1.2" fill="currentColor" />
    <path d="M4 5.5V4a2 2 0 0 1 4 0v1.5" fill="none" stroke="currentColor" strokeWidth="1.3" />
  </svg>
);

function Summary({ s, onResume, onReset }) {
  const [confirm, setConfirm] = useState(false);
  const doneSet = new Set(s.done);
  const doneMin = s.done.reduce((a, i) => a + FLAT[i].m, 0);
  const pct = Math.round((doneMin / TOTAL_MIN) * 100);
  const groups = PHASES.map((p, pi) => ({
    p,
    items: FLAT.map((x, i) => ({ x, i })).filter(({ x, i }) => x.phase === pi && doneSet.has(i)),
  })).filter((g) => g.items.length > 0);
  const headline = s.finished
    ? "Você fez a faxina inteira. A casa respira, e você também."
    : s.done.length === 0
      ? "Você abriu o app e tentou. Isso já conta."
      : "Você parou com dignidade. Olha o que você já fez.";
  return (
    <div className="summary">
      <span className="eyebrow">Resumo da noite</span>
      <h1>{headline}</h1>
      <div className="stats">
        <div className="stat"><b>{fmtDur(s.workMs)}</b><span>de faxina de verdade</span></div>
        <div className="stat"><b>{s.done.length}</b><span>{s.done.length === 1 ? "missão concluída" : "missões concluídas"}</span></div>
        <div className="stat"><b>{pct}%</b><span>do plano de 4h</span></div>
      </div>
      {groups.length > 0 && (
        <div className="wins">
          {groups.map(({ p, items }) => (
            <section className="win-phase" key={p.name}>
              <h2>{p.name}<small>{items.length === p.tasks.length ? "completa" : items.length + " de " + p.tasks.length}</small></h2>
              <ul>{items.map(({ x, i }) => <li key={i}>{x.w}</li>)}</ul>
            </section>
          ))}
        </div>
      )}
      {(s.panicWins > 0 || s.breaks > 0) && (
        <p className="lede">
          {s.panicWins > 0 && <>Você travou e destravou {s.panicWins} {s.panicWins === 1 ? "vez" : "vezes"}. </>}
          {s.breaks > 0 && <>Fez {s.breaks} {s.breaks === 1 ? "pausa" : "pausas"} para beber água.</>}
        </p>
      )}
      {doneSet.has(0) && <p className="lede">A Caixa do Depois guarda as decisões de hoje. Ela pode esperar fechada por uma semana.</p>}
      <p className="note">
        {s.finished
          ? "Agora é banho, água e cama. O resto da vida pode esperar até amanhã."
          : "O que ficou pode esperar até amanhã. Beba um copo de água, tire as luvas e vá descansar."}
      </p>
      {!s.finished && <button className="btn-done" onClick={onResume}>Na verdade, quero continuar</button>}
      <div className="confirm">
        {!confirm
          ? <button className="btn-quiet" onClick={() => setConfirm(true)}>Começar outra faxina do zero</button>
          : <>Apagar este progresso?
              <button className="chip" onClick={onReset}>Sim, recomeçar</button>
              <button className="chip" onClick={() => setConfirm(false)}>Não</button></>}
      </div>
    </div>
  );
}

function App() {
  const [s, setS] = useState(load);
  const [now, setNow] = useState(() => Date.now());
  const last = useRef(Date.now());

  // relógio + tempo trabalhado (conta só com o timer rodando)
  useEffect(() => {
    const id = setInterval(() => {
      const t = Date.now();
      const dt = Math.min(t - last.current, 15 * MIN);
      last.current = t;
      setNow(t);
      setS((p) => {
        let n = p;
        if ((p.mode === "task" || p.mode === "panic") && p.timer.endAt) {
          n = { ...n, workMs: n.workMs + dt, sinceBreakMs: n.sinceBreakMs + dt };
        }
        if (p.mode !== "summary" && p.timer.endAt && !p.timer.chimed && t >= p.timer.endAt) {
          chime();
          n = { ...n, timer: { ...n.timer, chimed: true } };
        }
        return n;
      });
    }, 500);
    return () => clearInterval(id);
  }, []);

  // salvar no navegador
  useEffect(() => { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} }, [s]);

  // apagar o aviso depois de alguns segundos
  const toastId = s.toast ? s.toast.id : null;
  useEffect(() => {
    if (!toastId) return;
    const h = setTimeout(() => setS((p) => (p.toast && p.toast.id === toastId ? { ...p, toast: null } : p)), 3200);
    return () => clearTimeout(h);
  }, [toastId]);

  // liberar o som no primeiro toque + manter a tela acesa
  useEffect(() => {
    let lock = null;
    const ask = async () => {
      try { if (navigator.wakeLock && document.visibilityState === "visible") lock = await navigator.wakeLock.request("screen"); } catch (e) {}
    };
    const first = () => { unlockAudio(); ask(); };
    window.addEventListener("pointerdown", first);
    document.addEventListener("visibilitychange", ask);
    ask();
    return () => {
      window.removeEventListener("pointerdown", first);
      document.removeEventListener("visibilitychange", ask);
      try { lock && lock.release(); } catch (e) {}
    };
  }, []);

  /* ---------- ações ---------- */
  const done = () => setS((p) => {
    if (p.mode === "panic") {
      return { ...p, mode: "task", panicLevel: 1, panicWins: p.panicWins + 1, timer: startTimer(FLAT[p.idx].m),
        toast: note("Destravou. Agora só o próximo passo.") };
    }
    const doneList = p.done.includes(p.idx) ? p.done : [...p.done, p.idx];
    const next = p.idx + 1;
    if (next >= FLAT.length) {
      return { ...p, done: doneList, mode: "summary", prevMode: "task", finished: true, timer: { ...p.timer, endAt: null, remaining: 0 } };
    }
    const phaseEnd = FLAT[next].phase !== FLAT[p.idx].phase;
    const msg = phaseEnd ? PHASE_DONE_MSG[FLAT[p.idx].phase] : CHEERS[p.cheer % CHEERS.length];
    const base = { ...p, done: doneList, idx: next, checks: [], cheer: p.cheer + 1, toast: note(msg) };
    if (p.sinceBreakMs >= BREAK_EVERY) return { ...base, mode: "break", timer: startTimer(BREAK_MIN) };
    return { ...base, timer: startTimer(FLAT[next].m) };
  });

  const panic = () => setS((p) => {
    const level = p.mode === "panic" ? 2 : 1;
    const pool = level === 1 ? PHASES[FLAT[p.idx].phase].panic.concat(PANIC_EXTRA) : PANIC_EASIER;
    return { ...p, mode: "panic", panicLevel: level, panicText: pick(pool, p.panicText), timer: startTimer(2), toast: null };
  });

  const endBreak = () => setS((p) => ({
    ...p, mode: "task", breaks: p.breaks + 1, sinceBreakMs: 0, timer: startTimer(FLAT[p.idx].m),
    toast: note("Água no corpo. Próxima missão."),
  }));

  const toggleStep = (i) => setS((p) => ({
    ...p, checks: p.checks.includes(i) ? p.checks.filter((x) => x !== i) : [...p.checks, i],
  }));

  const togglePause = () => setS((p) => {
    const tm = p.timer;
    if (tm.endAt) return { ...p, timer: { ...tm, remaining: tm.endAt - Date.now(), endAt: null } };
    return { ...p, timer: { ...tm, endAt: Date.now() + tm.remaining } };
  });

  const addFive = () => setS((p) => ({ ...p, timer: { ...startTimer(5), endAt: p.timer.endAt ? Date.now() + 5 * MIN : null } }));

  const endDignity = () => setS((p) => ({
    ...p, prevMode: p.mode, mode: "summary", toast: null,
    timer: p.timer.endAt ? { ...p.timer, remaining: p.timer.endAt - Date.now(), endAt: null } : p.timer,
  }));

  const resume = () => setS((p) => ({
    ...p, mode: p.prevMode === "summary" ? "task" : p.prevMode,
    timer: { ...p.timer, endAt: Date.now() + Math.max(p.timer.remaining, MIN) },
  }));

  const reset = () => { last.current = Date.now(); setS(fresh()); };

  /* ---------- tela ---------- */
  if (s.mode === "summary") {
    return <main className="app"><Summary s={s} onResume={resume} onReset={reset} /></main>;
  }

  const cur = FLAT[s.idx];
  const doneMin = s.done.reduce((a, i) => a + FLAT[i].m, 0);
  const pct = Math.round((doneMin / TOTAL_MIN) * 100);
  const phaseDone = PHASES.map((_, pi) => FLAT.every((x, i) => x.phase !== pi || s.done.includes(i)));
  const basicDone = phaseDone.slice(0, 4).every(Boolean);
  const over = timeLeft(s.timer, now) <= 0;

  const Top = (
    <header className="top">
      <div className="top-row">
        <span className="eyebrow">Fase {cur.phase + 1} de 5 · {PHASES[cur.phase].name}</span>
        <span className="pct">{pct}% · fim ~{fmtClock(estimateEnd(s, now))}</span>
      </div>
      <div className="bar" role="progressbar" aria-valuenow={pct} aria-valuemin="0" aria-valuemax="100" aria-label="Progresso geral">
        <i style={{ width: pct + "%" }} />
      </div>
      <div className="phases" aria-hidden="true">
        {PHASES.map((p, i) => <span key={i} className={"ph" + (phaseDone[i] ? " done" : i === cur.phase ? " now" : "")} />)}
      </div>
      <div className="ph-labels" aria-hidden="true">
        {PHASES.map((p, i) => (
          <span key={i} className={i === cur.phase ? "cur" : ""}>{p.locked && !basicDone && <Lock />}{p.short}</span>
        ))}
      </div>
    </header>
  );
  const Toast = s.toast && <div className="toast" key={s.toast.id} role="status">{s.toast.text}</div>;

  if (s.mode === "break") {
    const left = timeLeft(s.timer, now);
    const drunk = 1 - Math.max(0, Math.min(1, left / s.timer.duration));
    return (
      <main className="app">
        {Top}
        {Toast}
        <section className="stage">
          <span className="kind water">Pausa obrigatória · 5 min</span>
          <h1 className="mission">Tire as luvas e beba um copo de água inteiro. Sente um pouco.</h1>
          <div className="glass" aria-hidden="true"><i style={{ height: (100 - drunk * 85) + "%" }} /></div>
          <Ring tm={s.timer} now={now} color="var(--water)" label="de pausa" />
          <p className="hint">{over ? "Pausa feita. Pode voltar quando quiser." : "Você trabalhou 45 minutos. O botão libera quando a pausa acabar."}</p>
          <p className="hint">Na volta: {cur.t}</p>
        </section>
        <div className="actions">
          <button className="btn-done btn-water" disabled={!over} onClick={endBreak}>{over ? "Bebi. Voltar à missão" : "Bebendo água…"}</button>
          <button className="btn-quiet" onClick={endDignity}>Encerrar com dignidade</button>
        </div>
      </main>
    );
  }

  const isPanic = s.mode === "panic";
  const allChecked = !isPanic && cur.steps.every((_, i) => s.checks.includes(i));
  return (
    <main className="app">
      {Top}
      {Toast}
      <section className="stage">
        <span className={"kind" + (isPanic ? " panic" : "")}>
          {isPanic ? (s.panicLevel === 2 ? "Mais fácil ainda · 2 min" : "Missão de destravar · 2 min") : "Missão · " + cur.m + " min"}
        </span>
        <h1 className="mission">{isPanic ? s.panicText : cur.t}</h1>
        <div className="clock">
          <Ring tm={s.timer} now={now} color={isPanic ? "var(--panic)" : "var(--accent)"} label="restantes" />
          <div className="timer-tools">
            <button className="chip" onClick={togglePause}>{s.timer.endAt ? "Pausar" : "Continuar"}</button>
            {over && <button className="chip" onClick={addFive}>+5 min</button>}
          </div>
        </div>
        {over && <p className="hint">O tempo acabou, e está tudo bem. Terminou? Toque em Feito. Se não, siga no seu ritmo.</p>}
        {isPanic && <p className="hint">Só isso. Depois você volta para a missão, com o tempo zerado.</p>}
        {!isPanic && <Steps steps={cur.steps} checks={s.checks} onToggle={toggleStep} />}
        {!isPanic && cur.tip && <p className="tip"><b>Dica:</b> {cur.tip}</p>}
        {!isPanic && cur.warn && <p className="tip warn"><b>Cuidado:</b> {cur.warn}</p>}
      </section>
      <div className="actions">
        <button className={"btn-done" + (allChecked ? " ready" : "")} onClick={done}>Feito!</button>
        <button className="btn-panic" onClick={panic}>{isPanic ? "Travei de novo" : "Travei"}</button>
        <button className="btn-quiet" onClick={endDignity}>Encerrar com dignidade</button>
      </div>
    </main>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
