// Tempo estimado de cada palavra (peso = tamanho + pausa na pontuação)
function weightTimes(text, a, b) {
  const raw = text.split(/\s+/);
  const wt = raw.map(w => w.replace(/[^\p{L}\p{N}]/gu, '').length + 2.2 + (/[,:;.!?…]$/.test(w) ? 3 : 0));
  const total = wt.reduce((x, y) => x + y, 0);
  let acc = 0;
  return raw.map((w, i) => { const s = a + (b - a) * acc / total; acc += wt[i]; return { w: w.toUpperCase(), s, e: a + (b - a) * acc / total }; });
}
// Monta as legendas. As animações foram coreografadas sobre os tempos do roteiro
// (dStart/dEnd/dWords); com a narração gravada, cada cena é "esticada" palavra a palavra
// (kN → kD) para que cada animação aconteça exatamente na palavra falada.
function buildCaptions() {
  SCENES.forEach((sc, i) => {
    sc.dStart = sc.start; sc.dEnd = sc.end;
    sc.dWords = weightTimes(sc.text, sc.start + .08, sc.end - .12);
    const nz = NARRATION && NARRATION.scenes[i];
    if (nz && nz.words.length === sc.dWords.length) {
      sc.start = nz.start; sc.end = nz.end;
      sc.words = nz.words.map(x => ({ w: x.w.toUpperCase(), s: x.s, e: x.e }));
    } else sc.words = sc.dWords.map(x => ({ ...x }));
    sc.kN = [0, ...sc.words.map(x => x.s - sc.start), sc.end - sc.start];
    sc.kD = [0, ...sc.dWords.map(x => x.s - sc.dStart), sc.dEnd - sc.dStart];
    sc.pages = [];
    let cur = [], len = 0;
    sc.words.forEach((wd, k) => {
      cur.push(wd); len += wd.w.length + 1;
      const strong = /[:.…]$/.test(wd.w), comma = /,$/.test(wd.w);
      if (len >= 19 || cur.length >= 4 || strong || (comma && len >= 9) || k === sc.words.length - 1) {
        sc.pages.push({ words: cur, s: cur[0].s, e: cur[cur.length - 1].e });
        cur = []; len = 0;
      }
    });
  });
}
buildCaptions();
// Interpolação linear por partes entre dois conjuntos de "nós" de tempo
function warp(x, A, B) {
  if (x <= A[0]) return B[0] + (x - A[0]);
  for (let i = 1; i < A.length; i++) if (x <= A[i]) return lerp(B[i - 1], B[i], (x - A[i - 1]) / (A[i] - A[i - 1]));
  return B[B.length - 1] + (x - A[A.length - 1]);
}
const toDesign = (sc, lt) => warp(lt, sc.kN, sc.kD);
function designToReal(t) { // tempo absoluto do roteiro → tempo real do vídeo
  let i = SCENES.length - 1;
  while (i > 0 && t < SCENES[i].dStart) i--;
  const sc = SCENES[i];
  return sc.start + warp(t - sc.dStart, sc.kD, sc.kN);
}
const sceneIndex = t => { for (let i = SCENES.length - 1; i >= 0; i--) if (t >= SCENES[i].start) return i; return 0; };

const AU = {
  ctx: null, out: null, sfx: null, music: null, voice: null, recDest: null, noise: null,
  init() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    const c = this.ctx = new AC();
    const comp = c.createDynamicsCompressor();
    comp.threshold.value = -14; comp.knee.value = 8; comp.ratio.value = 4;
    comp.attack.value = .003; comp.release.value = .15;
    this.out = c.createGain(); this.out.gain.value = .9;
    this.sfx = c.createGain(); this.sfx.gain.value = .85;
    this.music = c.createGain(); this.music.gain.value = .3;
    this.voice = c.createGain(); this.voice.gain.value = 1.15;
    this.sfx.connect(this.out); this.music.connect(this.out); this.voice.connect(this.out);
    this.out.connect(comp); comp.connect(c.destination);
    this.recDest = c.createMediaStreamDestination(); // usado pela gravação do vídeo
    comp.connect(this.recDest);
    const len = c.sampleRate * 2, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.noise = buf;
  },
  // Oscilador com envelope exponencial (e glissando opcional)
  osc(type, freq, w, dur, { gain = .3, f2 = null, attack = .005, dest = this.sfx } = {}) {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, w);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, w + dur);
    g.gain.setValueAtTime(.0001, w);
    g.gain.exponentialRampToValueAtTime(gain, w + Math.min(attack, dur * .9));
    g.gain.exponentialRampToValueAtTime(.0001, w + dur);
    o.connect(g); g.connect(dest); o.start(w); o.stop(w + dur + .05);
  },
  // Ruído filtrado com envelope (e varredura de filtro opcional)
  nz(w, dur, { gain = .3, type = 'bandpass', f = 1000, f2 = null, q = 1, attack = .005, dest = this.sfx } = {}) {
    const c = this.ctx, s = c.createBufferSource(), fl = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.noise; s.loop = true;
    fl.type = type; fl.frequency.setValueAtTime(f, w); fl.Q.value = q;
    if (f2) fl.frequency.exponentialRampToValueAtTime(f2, w + dur);
    g.gain.setValueAtTime(.0001, w);
    g.gain.exponentialRampToValueAtTime(gain, w + Math.min(attack, dur * .9));
    g.gain.exponentialRampToValueAtTime(.0001, w + dur);
    s.connect(fl); fl.connect(g); g.connect(dest); s.start(w, Math.random() * 1.5); s.stop(w + dur + .05);
  },
  // ----- Efeitos -----
  pop(w, p = 1) { this.osc('sine', 380 * p, w, .11, { gain: .45, f2: 950 * p }); this.nz(w, .03, { gain: .12, f: 3000, q: 2 }); },
  swoosh(w, d = .38, up = true) { this.nz(w, d, { gain: .42, f: up ? 300 : 3800, f2: up ? 4200 : 350, q: .9, attack: d * .55 }); },
  impact(w, k = 1) {
    this.osc('sine', 140, w, .5, { gain: .9 * k, f2: 38, attack: .002 });
    this.osc('triangle', 70, w, .35, { gain: .5 * k, f2: 30, attack: .002 });

/* Narração opcional (Web Speech API). A linha do tempo continua sendo a referência:
   cada cena dispara sua fala no início e a velocidade é ajustada à duração da cena. */
const Voice = {
  voice: null,
  init() {
    if (!('speechSynthesis' in window)) return;
    const pick = () => {
      const vs = speechSynthesis.getVoices();
      this.voice = vs.find(v => /pt[-_]BR/i.test(v.lang)) || vs.find(v => /^pt/i.test(v.lang)) || null;
    };
    pick(); speechSynthesis.onvoiceschanged = pick;
  },
  speak(sc) {
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(sc.text);
    u.lang = 'pt-BR'; if (this.voice) u.voice = this.voice;
    u.rate = clamp(sc.text.length / ((sc.end - sc.start) * 15.5), .9, 2);
    u.pitch = 1.05; u.volume = 1;
    speechSynthesis.speak(u);
  },
  stop() { if ('speechSynthesis' in window) speechSynthesis.cancel(); },
};

/* =====================================================================
   3. PRIMITIVAS DE DESENHO + BONEQUINHOS PALITO
   ===================================================================== */
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);

  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function seg(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function dot(x, y, r) { ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, TAU); ctx.fill(); }
function ring(x, y, r) { ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, TAU); ctx.stroke(); }
function star(cx, cy, r, n = 5, inner = .45, rot = -Math.PI / 2) {
  ctx.beginPath();
  for (let i = 0; i < n * 2; i++) { const rad = i % 2 ? r * inner : r, a = rot + i * Math.PI / n; ctx.lineTo(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad); }

}
function text(str, x, y, size, fill, o = {}) {
  ctx.font = `900 ${size}px ${FONT}`; ctx.textAlign = o.align || 'center'; ctx.textBaseline = 'middle';
  if (o.stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = o.sw || size * .18; ctx.strokeStyle = o.stroke; ctx.strokeText(str, x, y); }
  ctx.fillStyle = fill; ctx.fillText(str, x, y);
}
// Etiqueta "pílula" (retorna a largura)
function tag(str, x, y, s, bg = C.yellow, fg = '#111', size = 44, rot = 0) {
  if (s <= .01) return 0;
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  ctx.font = `900 ${size}px ${FONT}`;
  const tw = ctx.measureText(str).width, pw = tw + size, ph = size * 1.5;
  ctx.fillStyle = 'rgba(0,0,0,.45)'; rr(-pw / 2 + 7, -ph / 2 + 9, pw, ph, ph * .32); ctx.fill();
  ctx.fillStyle = bg; rr(-pw / 2, -ph / 2, pw, ph, ph * .32); ctx.fill();
  ctx.fillStyle = fg; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(str, 0, size * .06);
  ctx.restore();

}
function strike(x, y, w, p, col = '#fff', lw = 10) {

  ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round';

/* ---------- Bonequinho palito (pés na origem, ~200px de altura em escala 1) ---------- */
function stickJoints(o) {
  const lean = o.lean || 0;
  const hip = { x: 0, y: -80 };
  const neck = { x: Math.sin(lean) * 66, y: hip.y - Math.cos(lean) * 66 };
  const head = { x: neck.x + Math.sin(lean) * 31, y: neck.y - Math.cos(lean) * 31 };
  const sh = { x: lerp(neck.x, hip.x, .12), y: lerp(neck.y, hip.y, .12) };
  const limb = (side, a, base) => {
    const e = { x: base.x + side * Math.sin(a[0]) * 40, y: base.y + Math.cos(a[0]) * 40 };
    const h = { x: e.x + side * Math.sin(a[0] + a[1]) * 40, y: e.y + Math.cos(a[0] + a[1]) * 40 };
    return { e, h, ang: Math.atan2(Math.cos(a[0] + a[1]), side * Math.sin(a[0] + a[1])) };
  };
  return {
    hip, neck, head, sh,
    armL: limb(-1, o.armL || [.45, .35], sh), armR: limb(1, o.armR || [.45, .35], sh),
    legL: limb(-1, o.legL || [.28, -.1], { x: hip.x, y: hip.y + 0 }), legR: limb(1, o.legR || [.28, -.1], hip),
  };
}
function stick(x, y, s, o = {}) {
  if (s <= .01) return null;
  const J = stickJoints(o), col = o.col || C.ink, sq = o.sq || 0;
  if (o.glow) halo(x, y - 110 * s, 170 * s, o.glow, .5);
  ctx.save();
  ctx.translate(x, y);
  if (o.rot) ctx.rotate(o.rot);
  ctx.scale(s * (1 + sq) * (o.flip ? -1 : 1), s * (1 - sq));
  if (o.alpha !== undefined) ctx.globalAlpha *= o.alpha;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (!o.noShadow) { ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(0, 4, 46, 9, 0, 0, TAU); ctx.fill(); }
  ctx.strokeStyle = col; ctx.lineWidth = o.lw || 10;
  const P = (...p) => { ctx.beginPath(); ctx.moveTo(p[0].x, p[0].y); for (let i = 1; i < p.length; i++) ctx.lineTo(p[i].x, p[i].y); ctx.stroke(); };
  P(J.hip, J.legL.e, J.legL.h); P(J.hip, J.legR.e, J.legR.h);
  P(J.hip, J.neck);
  P(J.sh, J.armL.e, J.armL.h); P(J.sh, J.armR.e, J.armR.h);
  if (o.hat === 'marx') marxHair(J.head.x, J.head.y);
  ctx.fillStyle = col; dot(J.head.x, J.head.y, 27);
  face(J.head.x, J.head.y, o.mood || 'neutral', o.look || 0, o.seed || 0);
  if (o.hat === 'marx') marxBeard(J.head.x, J.head.y);
  if (o.hat === 'top') hatTop(J.head.x, J.head.y, o.lean || 0);
  if (o.hat === 'helmet') hatHelmet(J.head.x, J.head.y, o.lean || 0);
  for (const k of ['L', 'R']) {
    const tool = o['tool' + k]; if (!tool) continue;
    const A = J['arm' + k];
    ctx.save(); ctx.translate(A.h.x, A.h.y);
    ctx.rotate(tool.abs !== undefined ? tool.abs : A.ang + (tool.rot || 0));
    ctx.scale(tool.s || 1, tool.s || 1); tool.draw(); ctx.restore();
  }
  ctx.fillStyle = col; dot(J.armL.h.x, J.armL.h.y, 7); dot(J.armR.h.x, J.armR.h.y, 7);
  ctx.restore();

}
function face(hx, hy, mood, look, seed) {
  ctx.save(); ctx.translate(hx + look * 6, hy);
  ctx.fillStyle = C.dark; ctx.strokeStyle = C.dark; ctx.lineWidth = 4; ctx.lineCap = 'round';
  const blink = ((T + seed * 1.37 + 2) % 4) < .12;
  if (mood === 'laugh') { ctx.beginPath(); ctx.moveTo(-14, -2); ctx.lineTo(-9, -8); ctx.lineTo(-4, -2); ctx.moveTo(4, -2); ctx.lineTo(9, -8); ctx.lineTo(14, -2); ctx.stroke(); }
  else if (blink) { seg(-14, -4, -5, -4); seg(5, -4, 14, -4); }
  else if (mood === 'surprised') { dot(-9, -5, 5.5); dot(9, -5, 5.5); }
  else { dot(-9, -4, 4); dot(9, -4, 4); }
  if (mood === 'angry' || mood === 'evil') { seg(-16, -16, -5, -11); seg(16, -16, 5, -11); }
  else if (mood === 'sad') { seg(-15, -12, -5, -16); seg(15, -12, 5, -16); }
  else if (mood === 'surprised') { seg(-15, -17, -5, -19); seg(5, -19, 15, -17); }

    case 'laugh': ctx.arc(0, 5, 12, 0, Math.PI); ctx.closePath(); ctx.fill(); break;
    case 'evil': ctx.moveTo(-12, 7); ctx.quadraticCurveTo(0, 17, 13, 3); ctx.stroke(); break;
    case 'sad': ctx.arc(0, 19, 9, 1.2 * Math.PI, 1.8 * Math.PI); ctx.stroke(); break;
    case 'surprised': ctx.ellipse(0, 11, 6, 8, 0, 0, TAU); ctx.fill(); break;
    case 'angry': ctx.moveTo(-9, 12); ctx.lineTo(9, 10); ctx.stroke(); break;

}
function hatTop(hx, hy, lean = 0) { // cartola do patrão
  ctx.save(); ctx.translate(hx, hy - 20); ctx.rotate(lean - .12);
  ctx.lineWidth = 4; ctx.strokeStyle = C.ink; ctx.fillStyle = '#0B0B0B';
  rr(-25, -60, 50, 58, 5); ctx.fill(); ctx.stroke();
  ctx.fillStyle = C.red; ctx.fillRect(-23, -17, 46, 10);
  ctx.fillStyle = '#0B0B0B'; rr(-40, -6, 80, 11, 5); ctx.fill(); ctx.stroke();
  ctx.restore();
}
function hatHelmet(hx, hy, lean = 0) { // capacete de operário
  ctx.save(); ctx.translate(hx, hy); ctx.rotate(lean);
  ctx.fillStyle = C.yellow; ctx.beginPath(); ctx.arc(0, -7, 30, Math.PI, 0); ctx.closePath(); ctx.fill();
  rr(-38, -12, 76, 9, 4); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.22)'; rr(-5, -36, 10, 26, 4); ctx.fill();
  ctx.restore();
}
function marxHair(hx, hy) {
  ctx.fillStyle = '#C9C9C9';
  [[-27, -6, 15], [27, -6, 15], [-23, -21, 14], [23, -21, 14], [-13, -31, 13], [13, -31, 13], [0, -34, 13]].forEach(([x, y, r]) => dot(hx + x, hy + y, r));

function marxBeard(hx, hy) {
  ctx.save();

  ctx.strokeStyle = '#7D7D7D'; ctx.lineWidth = 4; P.forEach(([x, y, r]) => ring(hx + x, hy + y, r));
  ctx.fillStyle = '#D6D6D6'; P.forEach(([x, y, r]) => dot(hx + x, hy + y, r));

  ctx.beginPath(); ctx.ellipse(hx - 8, hy + 9, 10, 5, .3, 0, TAU); ctx.ellipse(hx + 8, hy + 9, 10, 5, -.3, 0, TAU); ctx.fill();
  ctx.restore();
}

/* ---------- Ferramentas (cabo na origem, apontando para +x) ---------- */
const TOOL = {
  wrench() {
    ctx.fillStyle = C.steel; ctx.strokeStyle = '#4E5560'; ctx.lineWidth = 3;
    rr(-8, -6, 62, 12, 6); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(64, 0, 17, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = C.bg; rr(66, -6, 22, 12, 3); ctx.fill();
  },
  brush() {
    ctx.fillStyle = C.blue; rr(-14, -7, 96, 14, 7); ctx.fill();
    ctx.fillStyle = '#fff'; for (let i = 0; i < 5; i++) { rr(56 + i * 6, -27, 4, 21, 2); ctx.fill(); }
    ctx.fillStyle = C.cyan; ctx.beginPath(); ctx.ellipse(68, -32, 17, 7, 0, 0, TAU); ctx.fill();
  },
  magnifier() {

    ctx.strokeStyle = C.gold; ctx.lineWidth = 8; ring(64, 0, 24);
    ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(64, 0, 15, 3.6, 4.6); ctx.stroke();
  },
  cane() {

/* ---------- Objetos da Cena 1 ---------- */
function car(x, y, s, wheel = 0, col = C.red) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.lineJoin = 'round'; ctx.lineWidth = 5; ctx.strokeStyle = '#0B0B0B'; ctx.fillStyle = col;
  ctx.beginPath(); ctx.moveTo(-45, -52); ctx.lineTo(-26, -88); ctx.lineTo(30, -88); ctx.lineTo(52, -52); ctx.closePath(); ctx.fill(); ctx.stroke();
  rr(-85, -56, 170, 40, 14); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#9FE3FF';
  ctx.beginPath(); ctx.moveTo(-36, -55); ctx.lineTo(-22, -80); ctx.lineTo(-3, -80); ctx.lineTo(-3, -55); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(5, -55); ctx.lineTo(5, -80); ctx.lineTo(26, -80); ctx.lineTo(42, -55); ctx.closePath(); ctx.fill();
  ctx.fillStyle = C.yellow; rr(70, -48, 12, 10, 3); ctx.fill();
  for (const wx of [-50, 50]) {
    ctx.fillStyle = '#1A1A1A'; dot(wx, -14, 19); ctx.fillStyle = '#9A9A9A'; dot(wx, -14, 8);
    ctx.strokeStyle = '#1A1A1A'; ctx.lineWidth = 3;
    seg(wx + Math.cos(wheel) * 8, -14 + Math.sin(wheel) * 8, wx - Math.cos(wheel) * 8, -14 - Math.sin(wheel) * 8);
  }
  ctx.restore();
}

  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  ctx.lineJoin = 'round'; ctx.lineWidth = 6; ctx.strokeStyle = '#2A1C12';
  ctx.fillStyle = '#3A3A3C'; rr(-70, -900, 140, 790, 20); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#F4F1EA'; rr(-80, -135, 160, 42, 10); ctx.fill(); ctx.stroke();
  ctx.fillStyle = C.gold; dot(0, -114, 8);
  ctx.fillStyle = C.skin;
  for (let i = 0; i < 4; i++) {
    const fx = -55 + i * 37, len = (i === 1 || i === 2 ? 95 : 80) * (1 - .45 * grab);
    rr(fx - 16, 0, 32, 25 + len, 16); ctx.fill(); ctx.stroke();
  }
  rr(-75, -98, 150, 124, 30); ctx.fill(); ctx.stroke();
  ctx.save(); ctx.translate(70, -40); ctx.rotate(-.6 + grab * .7); rr(-15, 0, 30, 82, 15); ctx.fill(); ctx.stroke(); ctx.restore();
  ctx.strokeStyle = 'rgba(42,28,18,.35)'; ctx.lineWidth = 4; seg(-40, -30, -10, -20); seg(10, -45, 40, -38);
  ctx.restore();
}
function bigX(x, y, size, rot = 0) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  const h = size / 2;
  halo(0, 0, size * .8, 'rgba(255,59,48,.9)', .45);
  ctx.lineCap = 'round'; ctx.strokeStyle = '#8E0F08'; ctx.lineWidth = size * .24;
  ctx.save(); ctx.translate(8, 12); seg(-h, -h, h, h); seg(h, -h, -h, h); ctx.restore();
  ctx.strokeStyle = C.red; ctx.lineWidth = size * .22; seg(-h, -h, h, h); seg(h, -h, -h, h);
  ctx.strokeStyle = 'rgba(255,255,255,.45)'; ctx.lineWidth = size * .05; seg(-h * .8, -h * .85, h * .75, h * .7); seg(h * .8, -h * .85, -h * .75, h * .7);
  ctx.restore();

/* =====================================================================
   4. OBJETOS GEOMÉTRICOS (fábrica, engrenagens, pirâmide, balança...)
   ===================================================================== */
function gear(x, y, r, ang, col = C.gray, teeth) {
  const n = teeth || Math.max(6, Math.round(r / 11)), ri = r * .78, st = TAU / n;
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const a = i * st;
    ctx.lineTo(Math.cos(a) * ri, Math.sin(a) * ri);
    ctx.lineTo(Math.cos(a + st * .12) * r, Math.sin(a + st * .12) * r);
    ctx.lineTo(Math.cos(a + st * .45) * r, Math.sin(a + st * .45) * r);
    ctx.lineTo(Math.cos(a + st * .57) * ri, Math.sin(a + st * .57) * ri);
  }
  ctx.closePath();
  ctx.moveTo(r * .3, 0); ctx.arc(0, 0, r * .3, 0, TAU, true);
  ctx.fillStyle = col; ctx.fill('evenodd');
  ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = Math.max(2, r * .06); ring(0, 0, r * .55);

const F2 = { x: 480, y: 840, w: 600, h: 320 };

/* ---------- CENA 3 · 12s–22s · PROPRIEDADE PRIVADA → COLETIVA ---------- */
const F3 = { x: 540, y: 960, w: 520, h: 290 };

for (let i = 0; i < 6; i++) cue(12.35 + i * .08, w => AU.pop(w, .8 + i * .06));

cue(14.34, w => { AU.pop(w, .7); AU.evaporate(w, .6); }); cue(14.45, w => AU.tick(w, 900));
cue(15.26, w => AU.impact(w)); cue(15.3, w => AU.lock(w)); cue(15.45, w => AU.pop(w, 1.3));
for (let i = 0; i < 7; i++) cue(15.7 + i * .16, w => AU.zap(w));
cue(17.0, w => AU.pop(w, 1)); cue(17.55, w => AU.pop(w, 1.15)); cue(18.05, w => AU.pop(w, 1.3));
cue(19.6, w => AU.stamp(w)); cue(21.25, w => AU.chime(w)); cue(21.3, w => AU.pop(w, 1.4));
// Cena 4
cue(22.02, w => AU.pop(w)); cue(22.05, w => AU.swoosh(w, .6));
for (let j = 0; j < 11; j++) cue(22.3 + j * .18, w => AU.tick(w, j % 2 ? 1400 : 1900));
cue(22.9, w => AU.pop(w, 1.1)); cue(24.45, w => AU.swoosh(w, .5)); cue(24.6, w => AU.rumble(w, .6)); cue(24.95, w => AU.impact(w));
for (let i = 0; i < 6; i++) cue(25.3 + i * .08, w => AU.pop(w, .8 + i * .07));
cue(26.4, w => AU.stamp(w)); cue(27.0, w => AU.zap(w, .4));
for (let i = 0; i < 6; i++) cue(27.0 + i * .15 + .4, w => AU.pop(w, 1 + i * .05));
cue(27.95, w => AU.pop(w, 1.2)); cue(28.9, w => AU.evaporate(w, .6)); cue(29.45, w => AU.tick(w, 900));
cue(29.75, w => AU.rumble(w, 1.35)); cue(31.1, w => { AU.impact(w, .6); AU.evaporate(w, .5); }); cue(31.2, w => AU.chime(w)); cue(31.4, w => AU.pop(w, 1.4));
// Cena 5
cue(32.02, w => AU.pop(w)); cue(32.12, w => AU.pop(w, 1.2)); cue(32.3, w => AU.clink(w)); cue(32.55, w => AU.clink(w, 1.2));
cue(34.45, w => AU.evaporate(w, .8)); cue(34.9, w => AU.evaporate(w, .7));
cue(34.7, w => AU.stamp(w)); cue(35.85, w => AU.stamp(w)); cue(36.65, w => AU.stamp(w));
for (let i = 0; i < 3; i++) cue(37.45 + i * .1, w => AU.pop(w, 1 + i * .15));
cue(37.45, w => AU.impact(w, .4));
for (let j = 0; j < 6; j++) cue(37.7 + j * .3, w => AU.clink(w, j % 2 ? 1.2 : 1));
for (let i = 0; i < 3; i++) cue(38.2 + i * .5, w => AU.pop(w, 1.3));
for (let i = 0; i < 3; i++) cue(39.8 + i * .1, w => AU.pop(w, .7 + i * .1));
for (let i = 0; i < 3; i++) { cue(40.0 + i * .4, w => AU.swoosh(w, .3)); cue(40.45 + i * .4, w => AU.pop(w, 1.2 + i * .1)); }
cue(41.3, w => AU.chime(w));
// Cena 6
cue(42.02, w => AU.pop(w)); cue(42.12, w => AU.stamp(w));
for (let r = 0; r < 4; r++) { cue(42.4 + r * .2, w => AU.pop(w, .9 + r * .1)); cue(43.9 + r * .1, w => AU.impact(w, .45)); }
cue(43.0, w => AU.swoosh(w, .9)); cue(43.55, w => AU.stamp(w));
cue(44.3, w => AU.alarm(w, 4, .3)); cue(44.9, w => AU.pop(w, .8)); cue(45.4, w => AU.stamp(w));
cue(46.5, w => AU.swoosh(w, .45)); cue(46.95, w => AU.riser(w, 1.0)); cue(47.0, w => AU.swoosh(w, .5, false));
// Converte todos os eventos do roteiro para o tempo real (narrado)
CUES.forEach(c => { c[0] = designToReal(c[0]); });
CUES.sort((a, b) => a[0] - b[0]);
SHAKES.forEach(s => { s[0] = designToReal(s[0]); });
RUMBLES.forEach(r => { r[0] = designToReal(r[0]); r[1] = designToReal(r[1]); });
CUTS.forEach((c, i) => { CUTS[i] = designToReal(c); });
const BEAT_END = designToReal(46.4);

// Batida de fundo (120 BPM) — para em 46,4s para criar tensão antes do loop
const BASS = [55, 55, 65.41, 49];
function beatAt(i, w) {
  AU.kick(w); AU.hat(w + .25);
  if (i % 2 === 1) AU.clap(w);
  if (i % 8 === 0 || i % 8 === 3 || i % 8 === 6) AU.bass(w, BASS[Math.floor(i / 8) % 4]);
}

/* ---------- Estado de reprodução ---------- */
const $ = id => document.getElementById(id);
const overlay = $('overlay'), startBtn = $('startBtn'), restartBtn = $('restartBtn'), recordBtn = $('recordBtn'), recBadge = $('recBadge');
const OPT = { get voice() { return $('optVoice').value; }, get music() { return $('optMusic').checked; }, get loop() { return $('optLoop').checked && !state.recording; } };
const state = { running: false, t0: 0, a0: 0, cue: 0, beat: 0, scene: -1, recording: false, narrQueued: false };

function scheduleAudio(t) {
  if (!AU.ctx) return;
  const ahead = .12, now = AU.ctx.currentTime;
  while (state.cue < CUES.length && CUES[state.cue][0] <= t + ahead) {
    const [ct, fn] = CUES[state.cue++];
    if (ct >= t - .25) fn(Math.max(now, state.a0 + ct)); // ignora sons muito atrasados (aba em segundo plano)
  }
  if (OPT.voice === 'gravada' && OPT.loop && !state.narrQueued && t + ahead >= DURATION) {
    Narr.play(state.a0 + DURATION, 0); state.narrQueued = true; // emenda o loop sem atraso
  }
  while (state.beat * .5 <= t + ahead && state.beat * .5 < BEAT_END) {
    const bt = state.beat * .5;
    if (OPT.music && bt >= t - .1) beatAt(state.beat, Math.max(now, state.a0 + bt));
    state.beat++;
  }
}
/* Narração gravada: decodifica o MP3 embutido e toca em sincronia com o relógio do áudio */
const Narr = {
  buf: null, src: null, loading: null,
  load() {
    if (this.buf || !NARRATION || !AU.ctx) return Promise.resolve(this.buf);
    if (!this.loading) {
      const bin = atob(NARRATION.audio), u8 = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
      this.loading = new Promise(res => AU.ctx.decodeAudioData(u8.buffer, b => { this.buf = b; res(b); }, () => res(null)));
    }
    return this.loading;
  },
  play(when, offset = 0) {
    this.stop(); if (!this.buf) return;
    const s = AU.ctx.createBufferSource(); s.buffer = this.buf; s.connect(AU.voice);
    s.start(Math.max(AU.ctx.currentTime, when), Math.min(offset, this.buf.duration)); this.src = s;
  },
  stop() { if (this.src) { try { this.src.stop(); } catch (e) { /* já parado */ } this.src = null; } },
};
function applyMix() { // abaixa efeitos e batida quando a voz gravada está tocando
  if (!AU.ctx) return;
  const v = OPT.voice === 'gravada', now = AU.ctx.currentTime;
  AU.sfx.gain.setTargetAtTime(v ? .55 : .85, now, .05);
  AU.music.gain.setTargetAtTime(v ? .16 : .3, now, .05);
}
function resetClock(offsetMs = 80) {
  state.t0 = performance.now() + offsetMs;
  state.a0 = AU.ctx ? AU.ctx.currentTime + offsetMs / 1000 : 0;
  state.cue = 0; state.beat = 0; state.scene = -1; state.narrQueued = false;
}
async function start() {
  AU.init(); AU.ctx.resume();
  Voice.stop(); Narr.stop();
  if (OPT.voice === 'gravada') {
    startBtn.disabled = true;
    if (!(await Narr.load())) $('optVoice').value = 'navegador'; // sem decodificação → voz do navegador
    startBtn.disabled = false;
  }
  applyMix(); resetClock();
  if (OPT.voice === 'gravada') Narr.play(state.a0, 0);
  state.running = true;
  overlay.classList.add('hidden'); restartBtn.disabled = false;
}
function frame(now) {
  requestAnimationFrame(frame);
  if (!state.running) return;
  let t = Math.max(0, (now - state.t0) / 1000);
  if (t >= DURATION) {
    if (state.recording) { render(DURATION - .001); stopRecording(); return; }
    if (OPT.loop) {
      state.t0 += DURATION * 1000; state.a0 += DURATION;
      state.cue = 0; state.beat = 0; state.scene = -1; state.narrQueued = false; t -= DURATION;
    } else {
      render(DURATION - .001); state.running = false; Voice.stop(); Narr.stop();
      startBtn.textContent = '↻ Assistir de novo'; overlay.classList.remove('hidden');
      return;
    }
  }
  scheduleAudio(t);
  const si = sceneIndex(t);
  if (si !== state.scene) { state.scene = si; if (OPT.voice === 'navegador') Voice.speak(SCENES[si]); }
  render(t);
}

/* ---------- Mixagem offline da trilha completa (voz + efeitos + batida) ----------
   Usada por tools/renderizar_mp4.js para exportar o MP4 quadro a quadro. Retorna WAV 16 bits em base64. */
async function mixOffline(sr = 48000) {
  const saved = { ctx: AU.ctx, out: AU.out, sfx: AU.sfx, music: AU.music, voice: AU.voice, noise: AU.noise };
  const oc = new OfflineAudioContext(2, Math.round(sr * DURATION), sr);
  const comp = oc.createDynamicsCompressor();
  comp.threshold.value = -14; comp.knee.value = 8; comp.ratio.value = 4; comp.attack.value = .003; comp.release.value = .15;
  Object.assign(AU, { ctx: oc, out: oc.createGain(), sfx: oc.createGain(), music: oc.createGain(), voice: oc.createGain() });
  const voiceOn = !!NARRATION;
  AU.out.gain.value = .9; AU.sfx.gain.value = voiceOn ? .55 : .85; AU.music.gain.value = voiceOn ? .16 : .3; AU.voice.gain.value = 1.15;
  AU.sfx.connect(AU.out); AU.music.connect(AU.out); AU.voice.connect(AU.out); AU.out.connect(comp); comp.connect(oc.destination);
  const nb = oc.createBuffer(1, sr * 2, sr), nd = nb.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  AU.noise = nb;
  if (voiceOn) {
    const bin = atob(NARRATION.audio), u8 = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    const vb = await new Promise((res, rej) => oc.decodeAudioData(u8.buffer, res, rej));
    const src = oc.createBufferSource(); src.buffer = vb; src.connect(AU.voice); src.start(0);
  }
  for (const [t, fn] of CUES) fn(t);
  for (let i = 0; i * .5 < BEAT_END; i++) beatAt(i, i * .5);
  const buf = await oc.startRendering();
  Object.assign(AU, saved); // devolve o grafo de áudio ao vivo
  const L = buf.getChannelData(0), R = buf.getChannelData(1), n = L.length;
  const wav = new DataView(new ArrayBuffer(44 + n * 4));
  const str = (o, x) => { for (let i = 0; i < x.length; i++) wav.setUint8(o + i, x.charCodeAt(i)); };
  str(0, 'RIFF'); wav.setUint32(4, 36 + n * 4, true); str(8, 'WAVEfmt '); wav.setUint32(16, 16, true);
  wav.setUint16(20, 1, true); wav.setUint16(22, 2, true); wav.setUint32(24, sr, true); wav.setUint32(28, sr * 4, true);
  wav.setUint16(32, 4, true); wav.setUint16(34, 16, true); str(36, 'data'); wav.setUint32(40, n * 4, true);
  for (let i = 0, o = 44; i < n; i++, o += 4) {
    wav.setInt16(o, Math.max(-1, Math.min(1, L[i])) * 32767, true);
    wav.setInt16(o + 2, Math.max(-1, Math.min(1, R[i])) * 32767, true);
  }
  const bytes = new Uint8Array(wav.buffer);
  let b64 = '';
  for (let i = 0; i < bytes.length; i += 0x8000) b64 += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(b64);
}

/* ---------- Gravação do vídeo (canvas 60fps + áudio sintético) ---------- */
let recorder = null, chunks = [], recMime = '';
async function startRecording() {
  if (!window.MediaRecorder || !cv.captureStream) { alert('Seu navegador não suporta gravação de canvas (MediaRecorder). Use o Chrome ou o Edge.'); return; }
  AU.init(); AU.ctx.resume();
  const stream = new MediaStream([...cv.captureStream(60).getVideoTracks(), ...AU.recDest.stream.getAudioTracks()]);
  recMime = ['video/mp4;codecs=avc1,mp4a', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm', 'video/mp4'].find(m => MediaRecorder.isTypeSupported(m)) || '';
  recorder = new MediaRecorder(stream, recMime ? { mimeType: recMime, videoBitsPerSecond: 16e6 } : { videoBitsPerSecond: 16e6 });
  chunks = [];
  recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  recorder.onstop = () => {
    const type = recorder.mimeType || recMime || 'video/webm';
    const url = URL.createObjectURL(new Blob(chunks, { type }));
    const a = document.createElement('a');
    a.href = url; a.download = 'comunismo-shorts-1080x1920.' + (type.includes('mp4') ? 'mp4' : 'webm');
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  };
  state.recording = true; recBadge.style.display = 'block'; recordBtn.disabled = true;
  await start();
  recorder.start(250);
}
function stopRecording() {
  state.running = false; state.recording = false; Voice.stop(); Narr.stop();
  recBadge.style.display = 'none'; recordBtn.disabled = false;
  if (recorder && recorder.state !== 'inactive') recorder.stop();
  startBtn.textContent = '↻ Assistir de novo'; overlay.classList.remove('hidden');
}

/* ---------- Interface ---------- */
startBtn.addEventListener('click', start);
restartBtn.addEventListener('click', () => { if (!state.recording) start(); });
recordBtn.addEventListener('click', () => { if (!state.recording) startRecording(); });
$('fsBtn').addEventListener('click', () => { const st = $('stage'); (st.requestFullscreen || st.webkitRequestFullscreen || (() => {})).call(st); });
$('optVoice').addEventListener('change', async e => {
  Voice.stop(); Narr.stop(); applyMix();
  if (!state.running || !AU.ctx) return;
  if (e.target.value === 'gravada') { // retoma a voz gravada do ponto atual
    await Narr.load();
    const t = (performance.now() - state.t0) / 1000;
    Narr.play(AU.ctx.currentTime + .03, Math.max(0, t + .03)); state.narrQueued = false;
  } else if (e.target.value === 'navegador') state.scene = -1; // fala a cena atual no próximo quadro
});
if (!NARRATION) { $('optVoice').querySelector('option[value="gravada"]').remove(); $('optVoice').value = 'navegador'; }
window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.key === 'r' || e.key === 'R') { e.preventDefault(); if (!state.recording) start(); }
});

makeFlags();
Voice.init();
window.renderAt = render; // útil para gerar miniaturas / depuração
window.mixOffline = mixOffline;
const hashT = /t=([\d.]+)/.exec(location.hash);
if (hashT) { overlay.classList.add('hidden'); render(Math.min(DURATION - .001, parseFloat(hashT[1]))); }
else render(2.35);
if (document.fonts) document.fonts.load('900 76px Montserrat').then(() => { if (!state.running) render(hashT ? Math.min(DURATION - .001, parseFloat(hashT[1])) : 2.35); }).catch(() => {});
requestAnimationFrame(frame);
</script>
</body>
</html>
