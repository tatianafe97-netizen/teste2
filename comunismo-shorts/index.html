<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>O Que É Comunismo? · Shorts 9:16</title>
<style>
  :root { --bg:#0a0a0a; --panel:#1c1c1e; --ink:#f4f1ea; --yellow:#FFD60A; --red:#FF3B30; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; overflow:hidden; }
  #app { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:10px 16px; }
  #stage { position:relative; height:min(calc(100vh - 76px), calc((100vw - 32px) * 16 / 9)); aspect-ratio:9/16; border-radius:16px; overflow:hidden; box-shadow:0 24px 70px rgba(0,0,0,.65), 0 0 0 1px #262626; background:#121212; }
  #cv { width:100%; height:100%; display:block; }
  #overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2.2vh; padding:24px; text-align:center; background:radial-gradient(circle at 50% 40%, rgba(18,18,18,.55), rgba(8,8,8,.92)); }
  #overlay .kicker { font-weight:800; letter-spacing:.18em; font-size:clamp(10px,1.4vh,14px); color:var(--yellow); }
  #overlay h1 { font-weight:900; font-size:clamp(22px,4.6vh,46px); line-height:1.02; }
  #overlay h1 span { color:var(--yellow); }
  #overlay p { opacity:.72; font-size:clamp(11px,1.6vh,15px); max-width:30ch; line-height:1.4; }
  #startBtn { font:900 clamp(15px,2.4vh,22px)/1 system-ui,sans-serif; padding:1em 1.6em; border:0; border-radius:999px; background:var(--yellow); color:#111; cursor:pointer; box-shadow:0 7px 0 #a88c00, 0 14px 30px rgba(255,214,10,.25); animation:pulse 1.4s ease-in-out infinite; }
  #startBtn:active { transform:translateY(5px); box-shadow:0 2px 0 #a88c00; }
  @keyframes pulse { 50% { transform:scale(1.06); } }
  #recBadge { position:absolute; top:14px; left:50%; transform:translateX(-50%); background:var(--red); color:#fff; font:800 12px system-ui,sans-serif; padding:6px 12px; border-radius:999px; display:none; }
  #controls { display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; justify-content:center; font-size:13px; min-height:34px; }
  #controls button { font:700 13px system-ui,sans-serif; padding:8px 14px; border-radius:999px; border:1px solid #333; background:var(--panel); color:var(--ink); cursor:pointer; }
  #controls button:hover { border-color:#555; }
  #controls button:disabled { opacity:.4; cursor:not-allowed; }
  #controls label { display:flex; gap:6px; align-items:center; cursor:pointer; user-select:none; opacity:.9; }
  #controls input { accent-color:var(--yellow); }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv" width="1080" height="1920"></canvas>
    <div id="recBadge">● GRAVANDO</div>
    <div id="overlay">
      <div class="kicker">SHORTS · 9:16 · 1080×1920 · 48s</div>
      <h1>O QUE É<br><span>COMUNISMO?</span></h1>
      <p>Animação minimalista com legendas sincronizadas, efeitos sonoros sintéticos e narração opcional.</p>
      <button id="startBtn">▶ Iniciar Animação</button>
    </div>
  </div>
  <div id="controls">
    <button id="restartBtn" disabled>↻ Reiniciar</button>
    <button id="recordBtn">⏺ Gravar vídeo</button>
    <button id="fsBtn">⛶ Tela cheia</button>
    <label><input type="checkbox" id="optVoice" checked> Narração</label>
    <label><input type="checkbox" id="optMusic" checked> Batida</label>
    <label><input type="checkbox" id="optLoop" checked> Loop</label>
  </div>
</div>
<script>
'use strict';
/* =====================================================================
   1. CONFIGURAÇÃO, UTILITÁRIOS E ROTEIRO
   ===================================================================== */
const W = 1080, H = 1920, DURATION = 48;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const TAU = Math.PI * 2;
const FONT = '"Arial Black","Segoe UI Black","Helvetica Neue",Helvetica,Arial,sans-serif';
const C = {
  bg: '#121212', ink: '#F4F1EA', dark: '#151515', panel: '#2C2C2E', panel2: '#3A3A3C',
  yellow: '#FFD60A', red: '#FF3B30', green: '#30D158', blue: '#0A84FF', cyan: '#64D2FF',
  orange: '#FF9F0A', gray: '#8E8E93', steel: '#AEB6C2', skin: '#F2C6A0', gold: '#FFC300',
};
let T = 0; // tempo global (segundos) do quadro sendo desenhado

const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, t0, d) => clamp((t - t0) / d);
const rnd = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

// Funções de easing (elastic, bounce, back...)
const E = {
  linear: t => t,
  inQuad: t => t * t,
  outQuad: t => 1 - (1 - t) * (1 - t),
  inCubic: t => t * t * t,
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inOutCubic: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outExpo: t => t === 1 ? 1 : 1 - Math.pow(2, -10 * t),
  inBack: t => 2.70158 * t * t * t - 1.70158 * t * t,
  outBack: t => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2),
  outElastic: t => t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - .75) * (TAU / 3)) + 1,
  outBounce: t => {
    const n = 7.5625, d = 2.75;
    if (t < 1 / d) return n * t * t;
    if (t < 2 / d) return n * (t -= 1.5 / d) * t + .75;
    if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + .9375;
    return n * (t -= 2.625 / d) * t + .984375;
  },
};
// Entradas/saídas prontas: retornam escala 0..1 (com overshoot)
const pop = (t, t0, d = .6) => t < t0 ? 0 : E.outElastic(prog(t, t0, d));
const bk = (t, t0, d = .4) => t < t0 ? 0 : E.outBack(prog(t, t0, d));
const life = (t, a, b, din = .55, dout = .3, ease = pop) =>
  t < a ? 0 : t < b ? ease(t, a, din) : Math.max(0, 1 - E.inBack(prog(t, b, dout))) * ease(t, a, din);
// Oscilador baseado no tempo global (frequência em Hz). Todas as frequências usadas na
// abertura/fechamento são múltiplos de 1/48 Hz para o loop ser perfeito.
const osc = (f, a = 1, ph = 0) => Math.sin(T * f * TAU + ph) * a;

/* ---------------------------------------------------------------------
   Roteiro (texto narrado + legendas) — sincronizado por timestamps
   --------------------------------------------------------------------- */
const SCENES = [
  { start: 0, end: 4, accent: '#FF3B30',
    text: 'Esqueça a ideia de dividir sua escova de dentes: na teoria original, o comunismo não quer os seus bens pessoais, ele quer o controle das fábricas.' },
  { start: 4, end: 12, accent: '#FF9F0A',
    text: 'No século dezenove, Karl Marx observou que os trabalhadores produziam toda a riqueza nas fábricas, mas os donos das máquinas ficavam com quase todo o lucro.' },
  { start: 12, end: 22, accent: '#64D2FF',
    text: 'A proposta comunista é abolir a propriedade privada dos meios de produção: ou seja, terras, minas e indústrias deixam de ter um dono e passam a pertencer a todos.' },
  { start: 22, end: 32, accent: '#FFD60A',
    text: 'Mas isso não acontece da noite pro dia: primeiro vem o socialismo, onde um Estado forte controla tudo, até que as classes sociais sumam e o próprio Estado deixe de existir.' },
  { start: 32, end: 42, accent: '#30D158',
    text: 'No estágio final do comunismo teórico, não existe dinheiro, nem patrão, nem governo: cada um trabalha conforme sua capacidade e recebe conforme sua necessidade.' },
  { start: 42, end: 48, accent: '#FF3B30',
    text: 'Na história real, nenhum país conseguiu passar da fase do Estado forte para chegar a essa sociedade sem governo, mas para entender a raiz de tudo...' },
];

// Distribui cada palavra no intervalo da cena (peso = tamanho + pausa na pontuação)
// e agrupa em "páginas" curtas de legenda (estilo Shorts/TikTok).
function buildCaptions() {
  for (const sc of SCENES) {
    const raw = sc.text.split(/\s+/);
    const a = sc.start + .08, b = sc.end - .12;
    const wt = raw.map(w => w.replace(/[^\p{L}\p{N}]/gu, '').length + 2.2 + (/[,:;.!?…]$/.test(w) ? 3 : 0));
    const total = wt.reduce((x, y) => x + y, 0);
    let acc = 0;
    sc.words = raw.map((w, i) => {
      const s = a + (b - a) * acc / total; acc += wt[i];
      return { w: w.toUpperCase(), s, e: a + (b - a) * acc / total };
    });
    sc.pages = [];
    let cur = [], len = 0;
    sc.words.forEach((wd, i) => {
      cur.push(wd); len += wd.w.length + 1;
      const strong = /[:.…]$/.test(wd.w), comma = /,$/.test(wd.w);
      if (len >= 19 || cur.length >= 4 || strong || (comma && len >= 9) || i === sc.words.length - 1) {
        sc.pages.push({ words: cur, s: cur[0].s, e: cur[cur.length - 1].e });
        cur = []; len = 0;
      }
    });
  }
}
buildCaptions();
const sceneIndex = t => { for (let i = SCENES.length - 1; i >= 0; i--) if (t >= SCENES[i].start) return i; return 0; };

/* =====================================================================
   2. ÁUDIO SINTÉTICO (Web Audio API) — nenhum arquivo externo
   ===================================================================== */
const AU = {
  ctx: null, out: null, sfx: null, music: null, recDest: null, noise: null,
  init() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    const c = this.ctx = new AC();
    const comp = c.createDynamicsCompressor();
    comp.threshold.value = -14; comp.knee.value = 8; comp.ratio.value = 4;
    comp.attack.value = .003; comp.release.value = .15;
    this.out = c.createGain(); this.out.gain.value = .9;
    this.sfx = c.createGain(); this.sfx.gain.value = .85;
    this.music = c.createGain(); this.music.gain.value = .3;
    this.sfx.connect(this.out); this.music.connect(this.out);
    this.out.connect(comp); comp.connect(c.destination);
    this.recDest = c.createMediaStreamDestination(); // usado pela gravação do vídeo
    comp.connect(this.recDest);
    const len = c.sampleRate * 2, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.noise = buf;
  },
  // Oscilador com envelope exponencial (e glissando opcional)
  osc(type, freq, w, dur, { gain = .3, f2 = null, attack = .005, dest = this.sfx } = {}) {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, w);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, w + dur);
    g.gain.setValueAtTime(.0001, w);
    g.gain.exponentialRampToValueAtTime(gain, w + Math.min(attack, dur * .9));
    g.gain.exponentialRampToValueAtTime(.0001, w + dur);
    o.connect(g); g.connect(dest); o.start(w); o.stop(w + dur + .05);
  },
  // Ruído filtrado com envelope (e varredura de filtro opcional)
  nz(w, dur, { gain = .3, type = 'bandpass', f = 1000, f2 = null, q = 1, attack = .005, dest = this.sfx } = {}) {
    const c = this.ctx, s = c.createBufferSource(), fl = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.noise; s.loop = true;
    fl.type = type; fl.frequency.setValueAtTime(f, w); fl.Q.value = q;
    if (f2) fl.frequency.exponentialRampToValueAtTime(f2, w + dur);
    g.gain.setValueAtTime(.0001, w);
    g.gain.exponentialRampToValueAtTime(gain, w + Math.min(attack, dur * .9));
    g.gain.exponentialRampToValueAtTime(.0001, w + dur);
    s.connect(fl); fl.connect(g); g.connect(dest); s.start(w, Math.random() * 1.5); s.stop(w + dur + .05);
  },
  // ----- Efeitos -----
  pop(w, p = 1) { this.osc('sine', 380 * p, w, .11, { gain: .45, f2: 950 * p }); this.nz(w, .03, { gain: .12, f: 3000, q: 2 }); },
  swoosh(w, d = .38, up = true) { this.nz(w, d, { gain: .42, f: up ? 300 : 3800, f2: up ? 4200 : 350, q: .9, attack: d * .55 }); },
  impact(w, k = 1) {
    this.osc('sine', 140, w, .5, { gain: .9 * k, f2: 38, attack: .002 });
    this.osc('triangle', 70, w, .35, { gain: .5 * k, f2: 30, attack: .002 });
    this.nz(w, .35, { gain: .55 * k, type: 'lowpass', f: 1800, f2: 120, q: .7, attack: .002 });
  },
  beep(w, f = 880) { this.osc('square', f, w, .13, { gain: .16, attack: .003 }); this.osc('square', f * 1.5, w, .13, { gain: .05, attack: .003 }); },
  alarm(w, n = 4, gap = .3) { for (let i = 0; i < n; i++) this.beep(w + i * gap, i % 2 ? 660 : 990); },
  register(w) { // caixa registradora: mecanismo + sino + moedas
    this.nz(w, .06, { gain: .4, type: 'highpass', f: 2500, q: .7, attack: .001 });
    this.nz(w + .07, .12, { gain: .3, f: 1200, q: 3, attack: .002 });
    this.osc('sine', 2093, w + .16, .9, { gain: .3, attack: .003 });
    this.osc('sine', 2637, w + .16, .9, { gain: .22, attack: .003 });
    this.osc('sine', 4186, w + .16, .5, { gain: .08, attack: .003 });
    for (let i = 0; i < 6; i++) this.osc('sine', 3000 + Math.random() * 2500, w + .25 + i * .05, .12, { gain: .07, attack: .002 });
  },
  gearTick(w, p = 1) { this.nz(w, .04, { gain: .25, f: 2400 * p, q: 6, attack: .001 }); this.osc('square', 620 * p, w, .05, { gain: .04, attack: .001 }); },
  gears(w, dur) { // engrenagens industriais: zumbido grave + catraca + "clank" metálico
    const c = this.ctx, o = c.createOscillator(), o2 = c.createOscillator(), lp = c.createBiquadFilter(), g = c.createGain();
    o.type = 'sawtooth'; o.frequency.value = 55; o2.type = 'sawtooth'; o2.frequency.value = 82.5;
    lp.type = 'lowpass'; lp.frequency.value = 260;
    g.gain.setValueAtTime(.0001, w); g.gain.exponentialRampToValueAtTime(.12, w + .3);
    g.gain.setValueAtTime(.12, w + dur - .4); g.gain.exponentialRampToValueAtTime(.0001, w + dur);
    o.connect(lp); o2.connect(lp); lp.connect(g); g.connect(this.sfx);
    o.start(w); o2.start(w); o.stop(w + dur + .05); o2.stop(w + dur + .05);
    for (let k = 0, t = 0; t < dur - .1; k++, t = k * .16) this.gearTick(w + t, k % 2 ? .8 : 1);
    for (let t = .4; t < dur - .3; t += 1.1) { this.osc('triangle', 180, w + t, .25, { gain: .12, f2: 120 }); this.nz(w + t, .15, { gain: .12, f: 900, q: 8 }); }
  },
  zap(w, d = .22) { this.osc('sawtooth', 120, w, d, { gain: .1, f2: 900 }); this.nz(w, d, { gain: .13, f: 4000, q: 4 }); },
  xray(w, d) {
    this.osc('sawtooth', 60, w, d, { gain: .1, f2: 240, attack: .1 });
    this.osc('sine', 1200, w, d, { gain: .05, f2: 2400, attack: .1 });
    this.nz(w, d, { gain: .07, f: 2000, f2: 6000, q: 3, attack: .1 });
  },
  lock(w) { this.nz(w, .03, { gain: .5, type: 'highpass', f: 3000, attack: .001 }); this.nz(w + .07, .04, { gain: .6, f: 1800, q: 4, attack: .001 }); this.osc('square', 1400, w + .07, .04, { gain: .08, attack: .001 }); },
  evaporate(w, d = .7) { this.nz(w, d, { gain: .22, type: 'highpass', f: 1500, f2: 9000, attack: d * .3 }); this.osc('sine', 600, w, d, { gain: .09, f2: 2400, attack: .05 }); },
  rumble(w, d) { this.nz(w, d, { gain: .6, type: 'lowpass', f: 160, f2: 60, q: 1, attack: Math.min(.3, d * .4) }); this.osc('sine', 45, w, d, { gain: .3, attack: .15, f2: 30 }); },
  chime(w) { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => this.osc('sine', f, w + i * .07, .7, { gain: .17, attack: .004 })); },
  stamp(w) { this.impact(w, .45); this.nz(w, .08, { gain: .3, f: 900, q: 1.5, attack: .001 }); },
  tick(w, f = 1500) { this.osc('square', f, w, .03, { gain: .06, attack: .001 }); },
  riser(w, d) { this.nz(w, d, { gain: .3, f: 200, f2: 6000, q: 2, attack: d * .95 }); this.osc('sawtooth', 100, w, d, { gain: .05, f2: 800, attack: d * .9 }); },
  clink(w, p = 1) { this.osc('triangle', 1800 * p, w, .18, { gain: .12, attack: .001 }); this.osc('sine', 2700 * p, w, .12, { gain: .07, attack: .001 }); this.nz(w, .02, { gain: .2, type: 'highpass', f: 4000, attack: .001 }); },
  // ----- Batida de fundo (opcional) -----
  kick(w) { this.osc('sine', 150, w, .28, { gain: .7, f2: 42, attack: .002, dest: this.music }); },
  hat(w) { this.nz(w, .05, { gain: .16, type: 'highpass', f: 7000, attack: .001, dest: this.music }); },
  clap(w) { this.nz(w, .14, { gain: .3, f: 1500, q: 1.2, attack: .002, dest: this.music }); },
  bass(w, f) { this.osc('triangle', f, w, .24, { gain: .28, attack: .01, dest: this.music }); },
};

/* Narração opcional (Web Speech API). A linha do tempo continua sendo a referência:
   cada cena dispara sua fala no início e a velocidade é ajustada à duração da cena. */
const Voice = {
  voice: null,
  init() {
    if (!('speechSynthesis' in window)) return;
    const pick = () => {
      const vs = speechSynthesis.getVoices();
      this.voice = vs.find(v => /pt[-_]BR/i.test(v.lang)) || vs.find(v => /^pt/i.test(v.lang)) || null;
    };
    pick(); speechSynthesis.onvoiceschanged = pick;
  },
  speak(sc) {
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(sc.text);
    u.lang = 'pt-BR'; if (this.voice) u.voice = this.voice;
    u.rate = clamp(sc.text.length / ((sc.end - sc.start) * 15.5), .9, 2);
    u.pitch = 1.05; u.volume = 1;
    speechSynthesis.speak(u);
  },
  stop() { if ('speechSynthesis' in window) speechSynthesis.cancel(); },
};

/* =====================================================================
   3. PRIMITIVAS DE DESENHO + BONEQUINHOS PALITO
   ===================================================================== */
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function seg(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function dot(x, y, r) { ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, TAU); ctx.fill(); }
function ring(x, y, r) { ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, TAU); ctx.stroke(); }
function star(cx, cy, r, n = 5, inner = .45, rot = -Math.PI / 2) {
  ctx.beginPath();
  for (let i = 0; i < n * 2; i++) { const rad = i % 2 ? r * inner : r, a = rot + i * Math.PI / n; ctx.lineTo(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad); }
  ctx.closePath();
}
function text(str, x, y, size, fill, o = {}) {
  ctx.font = `900 ${size}px ${FONT}`; ctx.textAlign = o.align || 'center'; ctx.textBaseline = 'middle';
  if (o.stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = o.sw || size * .18; ctx.strokeStyle = o.stroke; ctx.strokeText(str, x, y); }
  ctx.fillStyle = fill; ctx.fillText(str, x, y);
}
// Etiqueta "pílula" (retorna a largura)
function tag(str, x, y, s, bg = C.yellow, fg = '#111', size = 44, rot = 0) {
  if (s <= .01) return 0;
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  ctx.font = `900 ${size}px ${FONT}`;
  const tw = ctx.measureText(str).width, pw = tw + size, ph = size * 1.5;
  ctx.fillStyle = 'rgba(0,0,0,.45)'; rr(-pw / 2 + 7, -ph / 2 + 9, pw, ph, ph * .32); ctx.fill();
  ctx.fillStyle = bg; rr(-pw / 2, -ph / 2, pw, ph, ph * .32); ctx.fill();
  ctx.fillStyle = fg; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(str, 0, size * .06);
  ctx.restore();
  return pw;
}
function strike(x, y, w, p, col = '#fff', lw = 10) {
  if (p <= 0) return;
  ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round';
  seg(x - w / 2, y + 4, x - w / 2 + w * p, y - 4); ctx.restore();
}
function halo(x, y, r, col, a = .55) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); ctx.restore();
}

/* ---------- Bonequinho palito (pés na origem, ~200px de altura em escala 1) ---------- */
function stickJoints(o) {

  }

/* ---------- CENA 6 · 42s–48s · TEORIA vs. REALIDADE + LOOP ---------- */
const ROWS6 = [['urss', 'URSS'], ['china', 'CHINA'], ['cuba', 'CUBA'], ['vietna', 'VIETNÃ']];
function scene6(t) {
  if (t >= 4.95) { stick(HERO.x, HERO.y, HERO.s, heroPose('happy')); return; } // volta ao gancho
  const zp = E.outCubic(prog(t, 0, .45));
  ctx.save(); ctx.globalAlpha = zp;
  ctx.fillStyle = 'rgba(255,255,255,.04)'; rr(110, 390, 280, 680, 18); ctx.fill();
  ctx.fillStyle = 'rgba(255,59,48,.10)'; rr(395, 390, 300, 680, 18); ctx.fill();
  ctx.strokeStyle = 'rgba(48,209,88,.8)'; ctx.lineWidth = 5; ctx.setLineDash([18, 14]); ctx.lineDashOffset = -T * 40;
  rr(715, 395, 250, 670, 18); ctx.stroke(); ctx.setLineDash([]);
  text('CAPITALISMO', 250, 330, 30, C.ink);
  text('ESTADO GIGANTE', 545, 330, 30, C.red);
  text('COMUNISMO', 840, 330, 30, C.green);
  ctx.restore();
  // Estado gigante ao fundo
  const gb = bk(t, 1.9, .4);
  if (gb > .01) { ctx.save(); ctx.globalAlpha = .3; ctx.translate(545, 1060); ctx.scale(gb, gb); stateBuilding(0, 0, 270, 340, T); ctx.restore(); }
  // Barreira: ninguém passou do "Estado forte"
  hazard(655, 395, 40, 670, bk(t, 1.55, .35));
  // Destino teórico nunca alcançado
  const qs = pop(t, 2.9, .7);
  if (qs > .01) { ctx.save(); ctx.translate(840, 720); ctx.scale(qs * (1 + osc(2, .06)), qs * (1 + osc(2, .06))); ctx.globalAlpha = .85; text('?', 0, 0, 190, C.green, { stroke: '#000', sw: 16 }); ctx.restore(); }
  tag('NUNCA ALCANÇADO', 840, 1112, bk(t, 3.4, .35), C.red, '#fff', 24, -.05);
  // Bandeiras históricas do século XX travadas
  ROWS6.forEach(([key, name], r) => {
    const y = 470 + r * 165, ps = bk(t, .4 + r * .2, .35); if (ps < .01) return;
    const t0 = 1.0 + r * .1, hit = t0 + .9;
    let fx = lerp(150, 520, E.inCubic(prog(t, t0, .9)));
    if (t > hit) { const u = t - hit; fx = 520 - 60 * Math.exp(-5 * u) * Math.abs(Math.sin(u * 11)); }
    ctx.save(); ctx.translate(fx + 65, y); ctx.scale(ps, ps); ctx.translate(-(fx + 65), -y);
    flagWave(key, fx, y - 43, 130, 86, T, r);
    text(name, fx + 65, y + 70, 26, C.ink, { stroke: '#121212', sw: 6 });
    ctx.restore();
    if (t > hit + .15) { const bs = pop(t, hit + .15, .5); ctx.save(); ctx.translate(fx + 138, y - 52); ctx.scale(bs, bs); ctx.fillStyle = C.red; dot(0, 0, 20); text('!', 0, 2, 28, '#fff'); ctx.restore(); }
  });
  alertSign(545, 1180, bk(t, 2.3, .35), Math.floor(t * 6) % 2 === 0);
  tag('SÉCULO XX', 540, 232, bk(t, .1, .35), C.red, '#fff', 46, -.03);
}
function cam6(t) {
  if (t < 4.95) {
    let z = lerp(1.2, 1, E.outCubic(prog(t, 0, .5)));
    z += .05 * E.inOutCubic(prog(t, 1.0, 1.0)) * (1 - E.inOutCubic(prog(t, 2.2, .8)));
    const w = E.inCubic(prog(t, 4.5, .45));
    return { x: 540, y: 960, z: lerp(z, .3, w), r: .7 * w };
  }
  const k = E.outExpo(prog(t, 4.95, .9));
  return { x: lerp(540, HF.x, k), y: lerp(960, HF.y, k), z: lerp(.5, 1.9, k), r: lerp(-.5, 0, k) };
}
function fx6(t) {
  if (t > 2.3 && t < 3.6) alertBorder(C.red);
  if (t > 4.95) speedLines(540, 960, T, 1 - prog(t, 5.0, .8));
}

/* =====================================================================
   7. MOTOR: câmera virtual, transições, legendas, sons e loop principal
   ===================================================================== */
[[scene1, cam1, fx1], [scene2, cam2], [scene3, cam3], [scene4, cam4], [scene5, cam5], [scene6, cam6, fx6]]
  .forEach(([draw, cam, fx], i) => Object.assign(SCENES[i], { draw, cam, fx }));

// Impactos (tempo absoluto, intensidade em px, duração) → screen shake + zoom-punch
const SHAKES = [
  [2.1, 42, .6], [3.4, 10, .25], [9.31, 22, .45], [11.25, 12, .3], [15.26, 34, .5], [19.6, 14, .3],
  [24.95, 28, .5], [26.4, 14, .3], [31.1, 18, .35], [34.85, 9, .25], [36.0, 9, .25], [36.8, 9, .25],
  [37.45, 12, .3], [43.55, 10, .25], [43.9, 9, .2], [44.0, 9, .2], [44.1, 9, .2], [44.2, 12, .25],
];
const RUMBLES = [[29.75, 31.1, 7]]; // tremor leve contínuo enquanto o Estado encolhe
function shakeAt(t) {
  let a = 0, z = 0;
  for (const [t0, A, d] of SHAKES) { const k = (t - t0) / d; if (k >= 0 && k < 1) { const f = (1 - k) * (1 - k); a += A * f; z += A / 500 * f * (1 - k); } }
  for (const [a0, a1, A] of RUMBLES) if (t >= a0 && t <= a1) a += A;
  return {
    x: a * (Math.sin(t * 93.1) + .6 * Math.sin(t * 151.7 + 1.3)) / 1.6,
    y: a * (Math.sin(t * 81.3 + 2.1) + .6 * Math.sin(t * 137.9)) / 1.6,
    r: a * .0009 * Math.sin(t * 67.7), z,
  };
}

let VIGNETTE = null;
function drawBackground(t, accent) {
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  const glow = ctx.createRadialGradient(540, 860, 60, 540, 860, 950);
  glow.addColorStop(0, accent + '26'); glow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
  const g = 90, ox = (t * 15) % g, oy = (t * 30) % g; // grade em movimento lento (período múltiplo de 48s)
  ctx.strokeStyle = 'rgba(255,255,255,.055)'; ctx.lineWidth = 2; ctx.beginPath();
  for (let x = ox - g; x < W + g; x += g) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = oy - g; y < H + g; y += g) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();
  if (!VIGNETTE) {
    VIGNETTE = ctx.createRadialGradient(540, 900, 500, 540, 900, 1250);
    VIGNETTE.addColorStop(0, 'rgba(0,0,0,0)'); VIGNETTE.addColorStop(1, 'rgba(0,0,0,.55)');
  }
  ctx.fillStyle = VIGNETTE; ctx.fillRect(0, 0, W, H);
}

const CUTS = [4, 12, 22, 32, 42, 46.95]; // transições em "wipe" diagonal
function drawTransition(t) {
  for (const c of CUTS) {
    const d = t - c; if (d < -.22 || d > .22) continue;
    const e = E.inOutCubic((d + .22) / .44), x = lerp(-1500, W + 1500, e);
    ctx.save(); ctx.translate(x, H / 2); ctx.rotate(-.35);
    ctx.fillStyle = C.yellow; ctx.fillRect(-950, -1700, 1900, 3400);
    ctx.fillStyle = '#111'; ctx.fillRect(-1000, -1700, 50, 3400); ctx.fillRect(950, -1700, 50, 3400);
    ctx.fillStyle = 'rgba(0,0,0,.12)'; for (let k = -900; k < 950; k += 160) ctx.fillRect(k, -1700, 60, 3400);
    ctx.restore();
  }
}
function drawHeader(t) {
  tag('O QUE É COMUNISMO?', 540, 112 + Math.sin(t * TAU * .5) * 4, 1, C.red, '#fff', 38, Math.sin(t * TAU * .25) * .015);
}
function drawProgress(t) {
  ctx.fillStyle = 'rgba(255,255,255,.14)'; ctx.fillRect(0, 0, W, 12);
  ctx.fillStyle = C.yellow; ctx.fillRect(0, 0, W * clamp(t / DURATION), 12);
}
// Legenda dinâmica: página atual centralizada embaixo, palavra ativa em amarelo
function drawCaptions(t) {
  const sc = SCENES[sceneIndex(t)];
  if (t < sc.pages[0].s) return;
  const page = sc.pages.find(p => t < p.e) || sc.pages[sc.pages.length - 1];
  const size = 76, lh = 98, maxW = 920;
  ctx.font = `900 ${size}px ${FONT}`;
  const sp = ctx.measureText(' ').width + 20;
  const ws = page.words.map(wd => ({ ...wd, ww: ctx.measureText(wd.w).width }));
  const width = arr => arr.reduce((a, wd) => a + wd.ww, 0) + sp * Math.max(0, arr.length - 1);
  let lines;
  if (width(ws) <= maxW) lines = [ws];
  else { // quebra em 2 linhas equilibradas (evita palavra órfã)
    let best = 1, bestW = Infinity;
    for (let i = 1; i < ws.length; i++) { const m = Math.max(width(ws.slice(0, i)), width(ws.slice(i))); if (m < bestW) { bestW = m; best = i; } }
    lines = [ws.slice(0, best), ws.slice(best)];
  }
  lines = lines.map(words => ({ words, w: width(words) }));
  const enter = E.outBack(prog(t, page.s, .18));
  ctx.save();
  ctx.translate(540, 1545 - (lines.length - 1) * lh / 2);
  ctx.scale(.85 + .15 * enter, .85 + .15 * enter);
  ctx.globalAlpha = clamp(enter * 1.6);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  lines.forEach((ln, li) => {
    let x = -ln.w / 2;
    for (const wd of ln.words) {
      const active = t >= wd.s && t < wd.e, k = active ? E.outBack(prog(t, wd.s, .12)) : 0;
      ctx.save(); ctx.translate(x + wd.ww / 2, li * lh); ctx.scale(1 + .14 * k, 1 + .14 * k); if (active) ctx.rotate(-.03);
      ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.lineWidth = 18; ctx.strokeText(wd.w, 0, 8);
      ctx.strokeStyle = '#000'; ctx.lineWidth = 16; ctx.strokeText(wd.w, 0, 0);
      ctx.fillStyle = active ? C.yellow : '#FFFFFF'; ctx.fillText(wd.w, 0, 0);
      ctx.restore();
      x += wd.ww + sp;
    }
  });
  ctx.restore();
}

// Renderiza um quadro completo no tempo t (0..48s)
function render(t) {
  T = t;
  const sc = SCENES[sceneIndex(t)], lt = t - sc.start;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  drawBackground(t, sc.accent);
  const cam = sc.cam(lt), sh = shakeAt(t), z = cam.z * (1 + sh.z);
  ctx.save();
  ctx.translate(W / 2 + sh.x, H / 2 + sh.y); ctx.rotate(cam.r + sh.r); ctx.scale(z, z); ctx.translate(-cam.x, -cam.y);
  sc.draw(lt);
  ctx.restore();
  if (sc.fx) sc.fx(lt);
  drawTransition(t);
  drawHeader(t);
  drawCaptions(t);
  drawProgress(t);
}

/* ---------- Trilha de efeitos sonoros sincronizada (tempo absoluto) ---------- */
const CUES = [];
const cue = (t, fn) => CUES.push([t, fn]);
// Transições
[3.82, 11.82, 21.82, 31.82, 41.82].forEach(t => cue(t, w => AU.swoosh(w, .4)));
// Cena 1
cue(.02, w => AU.pop(w, 1.1)); cue(.85, w => AU.pop(w, 1.3)); cue(1.0, w => AU.pop(w, 1.5));
cue(1.0, w => AU.swoosh(w, .85, false)); cue(1.85, w => AU.swoosh(w, .2));
cue(2.1, w => AU.impact(w)); cue(2.12, w => AU.alarm(w, 4, .2)); cue(2.2, w => AU.stamp(w));
cue(2.95, w => AU.pop(w, .9)); cue(3.05, w => AU.swoosh(w, .35, false)); cue(3.4, w => { AU.impact(w, .5); AU.clink(w, .7); });
cue(3.55, w => AU.riser(w, .45));
// Cena 2
cue(4.02, w => AU.pop(w, .8)); cue(4.05, w => AU.gears(w, 4.85)); cue(4.27, w => AU.pop(w, 1.1)); cue(5.08, w => AU.pop(w, 1.2));
for (let i = 0; i < 10; i++) cue(6.2 + i * .07, w => AU.pop(w, .9 + i * .07));
for (let j = 0; j < 20; j++) cue(7.0 + j * .09, w => AU.tick(w, 1200 + j * 60));
cue(8.85, w => AU.register(w)); cue(8.95, w => AU.swoosh(w, .4)); cue(9.05, w => AU.rumble(w, .5)); cue(9.31, w => AU.impact(w, .8));
cue(10.0, w => AU.swoosh(w, 1.1)); for (let j = 0; j < 10; j++) cue(10.0 + j * .11, w => AU.tick(w, 1800 - j * 50));
cue(11.25, w => AU.register(w)); cue(11.3, w => AU.stamp(w));
// Cena 3
cue(12.02, w => AU.pop(w)); cue(12.05, w => AU.gears(w, 1.6));
for (let i = 0; i < 6; i++) cue(12.35 + i * .08, w => AU.pop(w, .8 + i * .06));
cue(13.4, w => AU.xray(w, 1.5)); cue(13.85, w => AU.pop(w, 1.2)); cue(14.25, w => AU.evaporate(w, .5));
cue(14.34, w => { AU.pop(w, .7); AU.evaporate(w, .6); }); cue(14.45, w => AU.tick(w, 900));
cue(15.26, w => AU.impact(w)); cue(15.3, w => AU.lock(w)); cue(15.45, w => AU.pop(w, 1.3));
for (let i = 0; i < 7; i++) cue(15.7 + i * .16, w => AU.zap(w));
cue(17.0, w => AU.pop(w, 1)); cue(17.55, w => AU.pop(w, 1.15)); cue(18.05, w => AU.pop(w, 1.3));
cue(19.6, w => AU.stamp(w)); cue(21.25, w => AU.chime(w)); cue(21.3, w => AU.pop(w, 1.4));
// Cena 4
cue(22.02, w => AU.pop(w)); cue(22.05, w => AU.swoosh(w, .6));
for (let j = 0; j < 11; j++) cue(22.3 + j * .18, w => AU.tick(w, j % 2 ? 1400 : 1900));
cue(22.9, w => AU.pop(w, 1.1)); cue(24.45, w => AU.swoosh(w, .5)); cue(24.6, w => AU.rumble(w, .6)); cue(24.95, w => AU.impact(w));
for (let i = 0; i < 6; i++) cue(25.3 + i * .08, w => AU.pop(w, .8 + i * .07));
cue(26.4, w => AU.stamp(w)); cue(27.0, w => AU.zap(w, .4));
for (let i = 0; i < 6; i++) cue(27.0 + i * .15 + .4, w => AU.pop(w, 1 + i * .05));
cue(27.95, w => AU.pop(w, 1.2)); cue(28.9, w => AU.evaporate(w, .6)); cue(29.45, w => AU.tick(w, 900));
cue(29.75, w => AU.rumble(w, 1.35)); cue(31.1, w => { AU.impact(w, .6); AU.evaporate(w, .5); }); cue(31.2, w => AU.chime(w)); cue(31.4, w => AU.pop(w, 1.4));
// Cena 5
cue(32.02, w => AU.pop(w)); cue(32.12, w => AU.pop(w, 1.2)); cue(32.3, w => AU.clink(w)); cue(32.55, w => AU.clink(w, 1.2));
cue(34.45, w => AU.evaporate(w, .8)); cue(34.9, w => AU.evaporate(w, .7));
cue(34.7, w => AU.stamp(w)); cue(35.85, w => AU.stamp(w)); cue(36.65, w => AU.stamp(w));
for (let i = 0; i < 3; i++) cue(37.45 + i * .1, w => AU.pop(w, 1 + i * .15));
cue(37.45, w => AU.impact(w, .4));
for (let j = 0; j < 6; j++) cue(37.7 + j * .3, w => AU.clink(w, j % 2 ? 1.2 : 1));
for (let i = 0; i < 3; i++) cue(38.2 + i * .5, w => AU.pop(w, 1.3));
for (let i = 0; i < 3; i++) cue(39.8 + i * .1, w => AU.pop(w, .7 + i * .1));
for (let i = 0; i < 3; i++) { cue(40.0 + i * .4, w => AU.swoosh(w, .3)); cue(40.45 + i * .4, w => AU.pop(w, 1.2 + i * .1)); }
cue(41.3, w => AU.chime(w));
// Cena 6
cue(42.02, w => AU.pop(w)); cue(42.12, w => AU.stamp(w));
for (let r = 0; r < 4; r++) { cue(42.4 + r * .2, w => AU.pop(w, .9 + r * .1)); cue(43.9 + r * .1, w => AU.impact(w, .45)); }
cue(43.0, w => AU.swoosh(w, .9)); cue(43.55, w => AU.stamp(w));
cue(44.3, w => AU.alarm(w, 4, .3)); cue(44.9, w => AU.pop(w, .8)); cue(45.4, w => AU.stamp(w));
cue(46.5, w => AU.swoosh(w, .45)); cue(46.95, w => AU.riser(w, 1.0)); cue(47.0, w => AU.swoosh(w, .5, false));
CUES.sort((a, b) => a[0] - b[0]);

// Batida de fundo (120 BPM) — para em 46,4s para criar tensão antes do loop
const BASS = [55, 55, 65.41, 49];
function beatAt(i, w) {
  AU.kick(w); AU.hat(w + .25);
  if (i % 2 === 1) AU.clap(w);
  if (i % 8 === 0 || i % 8 === 3 || i % 8 === 6) AU.bass(w, BASS[Math.floor(i / 8) % 4]);
}

/* ---------- Estado de reprodução ---------- */
const $ = id => document.getElementById(id);
const overlay = $('overlay'), startBtn = $('startBtn'), restartBtn = $('restartBtn'), recordBtn = $('recordBtn'), recBadge = $('recBadge');
const OPT = { get voice() { return $('optVoice').checked; }, get music() { return $('optMusic').checked; }, get loop() { return $('optLoop').checked && !state.recording; } };
const state = { running: false, t0: 0, a0: 0, cue: 0, beat: 0, scene: -1, recording: false };

function scheduleAudio(t) {
  if (!AU.ctx) return;
  const ahead = .12, now = AU.ctx.currentTime;
  while (state.cue < CUES.length && CUES[state.cue][0] <= t + ahead) {
    const [ct, fn] = CUES[state.cue++];
    if (ct >= t - .25) fn(Math.max(now, state.a0 + ct)); // ignora sons muito atrasados (aba em segundo plano)
  }
  while (state.beat * .5 <= t + ahead && state.beat * .5 < 46.4) {
    const bt = state.beat * .5;
    if (OPT.music && bt >= t - .1) beatAt(state.beat, Math.max(now, state.a0 + bt));
    state.beat++;
  }
}
function resetClock(offsetMs = 80) {
  state.t0 = performance.now() + offsetMs;
  state.a0 = AU.ctx ? AU.ctx.currentTime + offsetMs / 1000 : 0;
  state.cue = 0; state.beat = 0; state.scene = -1;
}
function start() {
  AU.init(); AU.ctx.resume();
  Voice.stop(); resetClock();
  state.running = true;
  overlay.classList.add('hidden'); restartBtn.disabled = false;
}
function frame(now) {
  requestAnimationFrame(frame);
  if (!state.running) return;
  let t = Math.max(0, (now - state.t0) / 1000);
  if (t >= DURATION) {
    if (state.recording) { render(DURATION - .001); stopRecording(); return; }
    if (OPT.loop) {
      state.t0 += DURATION * 1000; state.a0 += DURATION;
      state.cue = 0; state.beat = 0; state.scene = -1; t -= DURATION;
    } else {
      render(DURATION - .001); state.running = false; Voice.stop();
      startBtn.textContent = '↻ Assistir de novo'; overlay.classList.remove('hidden');
      return;
    }
  }
  scheduleAudio(t);
  const si = sceneIndex(t);
  if (si !== state.scene) { state.scene = si; if (OPT.voice) Voice.speak(SCENES[si]); }
  render(t);
}

/* ---------- Gravação do vídeo (canvas 60fps + áudio sintético) ---------- */
let recorder = null, chunks = [], recMime = '';
function startRecording() {
  if (!window.MediaRecorder || !cv.captureStream) { alert('Seu navegador não suporta gravação de canvas (MediaRecorder). Use o Chrome ou o Edge.'); return; }
  AU.init(); AU.ctx.resume();
  const stream = new MediaStream([...cv.captureStream(60).getVideoTracks(), ...AU.recDest.stream.getAudioTracks()]);
  recMime = ['video/mp4;codecs=avc1,mp4a', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm', 'video/mp4'].find(m => MediaRecorder.isTypeSupported(m)) || '';
  recorder = new MediaRecorder(stream, recMime ? { mimeType: recMime, videoBitsPerSecond: 16e6 } : { videoBitsPerSecond: 16e6 });
  chunks = [];
  recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  recorder.onstop = () => {
    const type = recorder.mimeType || recMime || 'video/webm';
    const url = URL.createObjectURL(new Blob(chunks, { type }));
    const a = document.createElement('a');
    a.href = url; a.download = 'comunismo-shorts-1080x1920.' + (type.includes('mp4') ? 'mp4' : 'webm');
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  };
  state.recording = true; recBadge.style.display = 'block'; recordBtn.disabled = true;
  start();
  recorder.start(250);
}
function stopRecording() {
  state.running = false; state.recording = false; Voice.stop();
  recBadge.style.display = 'none'; recordBtn.disabled = false;
  if (recorder && recorder.state !== 'inactive') recorder.stop();
  startBtn.textContent = '↻ Assistir de novo'; overlay.classList.remove('hidden');
}

/* ---------- Interface ---------- */
startBtn.addEventListener('click', start);
restartBtn.addEventListener('click', () => { if (!state.recording) start(); });
recordBtn.addEventListener('click', () => { if (!state.recording) startRecording(); });
$('fsBtn').addEventListener('click', () => { const st = $('stage'); (st.requestFullscreen || st.webkitRequestFullscreen || (() => {})).call(st); });
$('optVoice').addEventListener('change', e => { if (!e.target.checked) Voice.stop(); });
window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.key === 'r' || e.key === 'R') { e.preventDefault(); if (!state.recording) start(); }
});

makeFlags();
Voice.init();
window.renderAt = render; // útil para gerar miniaturas / depuração
const hashT = /t=([\d.]+)/.exec(location.hash);
if (hashT) { overlay.classList.add('hidden'); render(Math.min(DURATION - .001, parseFloat(hashT[1]))); }
else render(2.35);
requestAnimationFrame(frame);
</script>
