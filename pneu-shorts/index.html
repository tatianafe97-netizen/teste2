<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Como Nasce um Pneu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&display=swap">
<style>
/* Layout: palco 9:16 centralizado na altura da janela; tela de início sobre o palco; barra de controles compacta logo abaixo. */
:root {
  --page: #0e0e0e;
  --panel: #1b1a19;
  --line: #34312e;
  --ink: #f4f1ec;
  --muted: #a8a29a;
  --accent: #ffd60a;
  --accent-deep: #b39500;
  --accent-ink: #161616;
  --font: "Archivo", "Arial Black", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--font); overflow: hidden; }
.app { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.stage { position: relative; width: min(100%, calc((100vh - 96px) * 0.5625)); aspect-ratio: 9 / 16; max-width: 100%; border-radius: 18px; overflow: hidden; box-shadow: 0 0 0 1px var(--line), 0 24px 60px rgba(0, 0, 0, .5); }
@supports (height: 100dvh) { .stage { width: min(100%, calc((100dvh - 96px) * 0.5625)); } }
canvas { display: block; width: 100%; height: 100%; }
.overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px; text-align: center; background: rgba(14, 14, 14, .74); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); }
.kicker { font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); font-weight: 800; }
.overlay h1 { margin: 0; font-size: clamp(28px, 7vw, 44px); line-height: 1; font-weight: 900; text-wrap: balance; text-transform: uppercase; }
.overlay p { margin: 0; max-width: 30ch; color: var(--muted); font-size: 14px; line-height: 1.45; }
.start { font: 900 18px/1 var(--font); color: var(--accent-ink); background: var(--accent); border: 0; border-radius: 999px; padding: 18px 30px; cursor: pointer; text-transform: uppercase; letter-spacing: .04em; box-shadow: 0 6px 0 var(--accent-deep); transition: transform .08s, box-shadow .08s; }
.start:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--accent-deep); }
.opts { display: grid; gap: 10px; text-align: left; font-size: 14px; font-weight: 500; }
.opts label { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.opts input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
.bar { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; width: min(100%, 600px); }
.bar button { font: 700 12px/1 var(--font); color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 9px 12px; cursor: pointer; }
.bar button:hover { border-color: var(--muted); }
.bar button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.bar button.rec[aria-pressed="true"] { background: #ff3b30; color: #fff; border-color: #ff3b30; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.clock { font: 700 12px/1 var(--font); color: var(--muted); font-variant-numeric: tabular-nums; align-self: center; min-width: 84px; text-align: center; }
.toast { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line); padding: 9px 13px; border-radius: 10px; font-size: 12px; line-height: 1.35; color: var(--ink); width: max-content; max-width: 90%; text-align: center; }
@media (prefers-reduced-motion: reduce) { .start { transition: none; } }
</style>
</head>
<body>
<div class="app">
  <div class="stage" id="stage">
    <canvas id="cv" width="1080" height="1920" aria-label="Animação vertical: como é feito um pneu"></canvas>
    <div class="overlay" id="overlay">
      <div class="kicker">Shorts · 9:16 · 1080×1920 · 48 s</div>
      <h1>Como nasce um pneu</h1>
      <p>Legendas palavra por palavra, efeitos sonoros sintetizados na hora e narração opcional.</p>
      <button class="start" id="startBtn" type="button">Iniciar Animação</button>
      <div class="opts">
        <label for="optVoice"><input type="checkbox" id="optVoice"> Narração por voz (Web Speech)</label>
        <label for="optMusic"><input type="checkbox" id="optMusic" checked> Batida de fundo</label>
        <label for="optDark"><input type="checkbox" id="optDark"> Fundo escuro (#121212)</label>
      </div>
    </div>
    <div class="toast" id="toast" hidden></div>
  </div>
  <div class="bar" id="bar">
    <button id="bPlay" type="button">Pausar</button>
    <button id="bRestart" type="button">Reiniciar</button>
    <button id="bSound" type="button" aria-pressed="true">Som</button>
    <button id="bVoice" type="button" aria-pressed="false">Voz</button>
    <button id="bTheme" type="button" aria-pressed="false">Escuro</button>
    <button id="bRec" class="rec" type="button" aria-pressed="false">Gravar .webm</button>
    <span class="clock" id="clock">00.0 / 48.0 s</span>
  </div>
</div>
<script>
'use strict';
/* ============================================================
   NÚCLEO: dimensões, temas, cores, easing e utilidades
   ============================================================ */
const W = 1080, H = 1920, DURATION = 48, TAU = Math.PI * 2;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d', { alpha: false });
const FONT = '"Archivo", "Arial Black", "Helvetica Neue", Arial, sans-serif';
const f = (w, s) => `${w} ${s}px ${FONT}`;

const THEMES = {
  light: { bg: '#FAF8F5', ink: '#161616', grid: 'rgba(22,22,22,0.07)', paper: '#FFFFFF', soft: '#E9E3D9', steam: 'rgba(140,140,140,', shadow: 'rgba(22,22,22,0.14)' },
  dark:  { bg: '#121212', ink: '#F2EFEA', grid: 'rgba(242,239,234,0.07)', paper: '#1F1E1D', soft: '#2C2A27', steam: 'rgba(225,225,225,', shadow: 'rgba(0,0,0,0.45)' },
};
let TH = THEMES.light;
const C = {
  yellow: '#FFD60A', red: '#FF3B30', blue: '#2F7BFF', orange: '#FF8A00', steel: '#A3AEB9', steelD: '#5E6873',
  rubber: '#262626', latex: '#FFFFFF', sulfur: '#F7C600', silica: '#BFE0F5', cyan: '#5CF2FF', xbg: '#06182B',
  laser: '#2CFF6E', greenTire: '#55625A', ok: '#14B866', glass: '#BDEFFF', lime: '#7CFF4F',
};
const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const inv = (a, b, v) => clamp((v - a) / (b - a));
const frac = v => v - Math.floor(v);
const E = {
  inCubic: t => t * t * t,
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inOutCubic: t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
  outBack: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  inBack: t => { const c1 = 1.70158; return (c1 + 1) * t * t * t - c1 * t * t; },
  outElastic: t => (t <= 0 ? 0 : t >= 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (TAU / 3)) + 1),
  outBounce: t => {
    const n1 = 7.5625, d1 = 2.75;
    if (t < 1 / d1) return n1 * t * t;
    if (t < 2 / d1) return n1 * (t -= 1.5 / d1) * t + 0.75;
    if (t < 2.5 / d1) return n1 * (t -= 2.25 / d1) * t + 0.9375;
    return n1 * (t -= 2.625 / d1) * t + 0.984375;
  },
};
/* pop: escala elástica (0 → 1) a partir de t0; drop: queda com quique */
const pop = (t, t0, d = 0.7) => (t < t0 ? 0 : E.outElastic(clamp((t - t0) / d)));
const drop = (t, t0, d = 0.6) => (t < t0 ? 0 : E.outBounce(clamp((t - t0) / d)));
const punch = (t, t0, amp, decay = 4) => (t < t0 ? 0 : amp * Math.exp(-(t - t0) * decay));
const rnd = i => frac(Math.sin(i * 127.1 + 311.7) * 43758.5453);
const wob = (t, seed) => Math.sin(t * 37.3 + seed) * 0.5 + Math.sin(t * 53.7 + seed * 2.1) * 0.3 + Math.sin(t * 91.1 + seed * 3.7) * 0.2;

/* ============================================================
   ROTEIRO: cenas, legendas e tempos de cada palavra
   ============================================================ */
const SCENES = [
  { start: 0,  end: 4,  tag: 'O GANCHO',           text: 'Se o pneu do seu carro fosse feito só de borracha, ele derreteria na primeira esquina, e a receita real parece bruxaria industrial.' },
  { start: 4,  end: 12, tag: 'A RECEITA QUÍMICA',  text: 'Tudo começa misturando borracha natural com petróleo, sílica e um pó chamado negro de fumo, que é o que deixa o pneu preto e ultra resistente.' },
  { start: 12, end: 22, tag: 'ESQUELETO DE AÇO',   text: 'Depois, máquinas prensam essa massa junto com cabos de aço e tecidos de nylon, criando um esqueleto flexível que aguenta toneladas sem rasgar.' },
  { start: 22, end: 32, tag: 'TAMBOR DE MONTAGEM', text: 'Num cilindro giratório, dezenas de camadas e aros de aço são montados como um sanduíche perfeito, até que uma bolsa de ar infla tudo, criando o chamado pneu verde, ainda liso.' },
  { start: 32, end: 42, tag: 'VULCANIZAÇÃO',       text: 'A mágica final é a vulcanização: ele vai para um forno de alta pressão a 170 graus, onde o calor reorganiza as moléculas da borracha e o molde esculpe os sulcos.' },
  { start: 42, end: 48, tag: 'TESTE FINAL',        text: 'Depois de passar por um raio-X que caça bolhas invisíveis de ar, ele está pronto para rodar milhares de quilômetros no asfalto quente, porque...' },
];
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9-]/g, '');

/* Distribui as palavras dentro da janela de cada cena, com peso pelo tamanho da palavra e pausa após pontuação. */
function buildTimeline() {
  for (const s of SCENES) {
    const raw = s.text.split(/\s+/);
    const wts = raw.map(w => {
      let k = 1.2 + norm(w).replace(/-/g, '').length * 0.32;
      if (/[,:;]$/.test(w)) k += 1.0;
      else if (/[.!?]$/.test(w) && !/\.\.\.$/.test(w)) k += 1.2;
      return k;
    });
    const lead = 0.12, tail = 0.22, span = s.end - s.start - lead - tail;
    const sum = wts.reduce((a, b) => a + b, 0);
    let acc = s.start + lead;
    s.words = raw.map((w, i) => { const d = wts[i] / sum * span; const o = { w: w.toUpperCase(), t0: acc, t1: acc + d }; acc += d; return o; });
    s.chunks = [];
    let cur = null;
    s.words.forEach((w, i) => {
      if (!cur) { cur = { idx: [], chars: 0 }; s.chunks.push(cur); }
      cur.idx.push(i); cur.chars += w.w.length + 1;
      if (cur.idx.length >= 4 || cur.chars >= 19 || /[,.:!?]$/.test(w.w)) cur = null;
    });
    s.chunks.forEach((ch, i) => {
      ch.t0 = s.words[ch.idx[0]].t0;
      ch.t1 = i < s.chunks.length - 1 ? s.words[s.chunks[i + 1].idx[0]].t0 : s.end;
    });
  }
}
/* Instante exato em que uma palavra-chave é dita (usado para sincronizar animações e sons). */
function wt(si, frag, nth = 0) {
  const target = norm(frag);
  let n = 0;
  for (const w of SCENES[si].words) {
    const k = norm(w.w);
    if (k === target || (target.length >= 4 && k.startsWith(target))) { if (n === nth) return w.t0; n++; }
  }
  console.warn('Palavra-chave não encontrada:', frag);
  return SCENES[si].start;
}
const sceneIndex = t => { for (let i = 0; i < SCENES.length; i++) if (t < SCENES[i].end) return i; return SCENES.length - 1; };

let K = {}, INGR = [], LAYER_T = [], EV = [], SHAKES = [];
function buildKeys() {
  K = {
    zoom: wt(0, 'feito'), alert: wt(0, 'borracha'), melt: wt(0, 'derreteria'), esquina: wt(0, 'esquina'), receita: wt(0, 'receita'), bruxa: wt(0, 'bruxaria'),
    latex: wt(1, 'borracha'), oil: wt(1, 'petroleo'), silica: wt(1, 'silica'), carbon: wt(1, 'negro'), preto: wt(1, 'preto'), ultra: wt(1, 'ultra'),
    rollers: wt(2, 'maquinas'), press: wt(2, 'prensam'), steel: wt(2, 'cabos'), nylon: wt(2, 'nylon'), skeleton: wt(2, 'esqueleto'), flex: wt(2, 'flexivel'), tons: wt(2, 'toneladas'), rasgar: wt(2, 'rasgar'),
    layers: wt(3, 'dezenas'), beads: wt(3, 'aros'), sandwich: wt(3, 'sanduiche'), inflate: wt(3, 'bolsa'), greenT: wt(3, 'chamado'), liso: wt(3, 'liso'),
    vulc: wt(4, 'vulcanizacao'), forno: wt(4, 'forno'), pressao: wt(4, 'pressao'), temp: wt(4, '170'), molec: wt(4, 'reorganiza'), molde: wt(4, 'molde'), sulcos: wt(4, 'sulcos'),
    scan: wt(5, 'raio-x'), bolhas: wt(5, 'bolhas'), aprov: wt(5, 'ar'), pronto: wt(5, 'pronto'), km: wt(5, 'milhares'), asfalto: wt(5, 'asfalto'), porque: wt(5, 'porque'),
  };
  K.sulfur = (K.carbon + K.preto) / 2 + 0.15;
  K.weightLand = K.tons + 0.4;
  K.beadsIn = K.beads + 0.5;
  K.layersEnd = K.inflate - 0.45;
  K.mount = K.pronto + 0.55;
  K.drive = K.mount + 0.25;

  INGR = [
    { name: 'LÁTEX', col: C.latex, cue: K.latex, kind: 'drop', mix: '#F1EDE4' },
    { name: 'PETRÓLEO', col: '#151515', cue: K.oil, kind: 'drop', mix: '#9C958C' },
    { name: 'SÍLICA', col: C.silica, cue: K.silica, kind: 'grain', mix: '#A9B3B9' },
    { name: 'NEGRO DE FUMO', col: '#0B0B0B', cue: K.carbon, kind: 'puff', mix: '#2A2A2A' },
    { name: 'ENXOFRE', col: C.sulfur, cue: K.sulfur, kind: 'grain', mix: '#242424' },
  ];
  INGR.forEach(g => { g.ts = g.cue - 0.3; g.tr = g.ts + 0.3; g.land = g.tr + 0.5; });

  LAYER_T = [];
  for (let i = 0; i < 20; i++) LAYER_T.push(lerp(K.layers, K.layersEnd, i / 20));

  /* Linha do tempo de efeitos sonoros: [tempo, som, argumento] */
  EV = [
    [0.02, 'whoosh'], [K.zoom, 'zoom'], [K.alert, 'alarm'], [K.melt, 'drip'], [K.melt + 0.22, 'drip'], [K.melt + 0.44, 'drip'],
    [K.receita, 'pop'], [K.receita + 0.2, 'tick'], [K.bruxa, 'sparkle'],
    [4.12, 'thump'], [4.4, 'pop'],
    [INGR[0].land, 'rumble', 12 - INGR[0].land - 0.2],
    [K.preto, 'clank'], [K.ultra, 'stamp'],
    [12.05, 'beep'], [12.3, 'scan'], [K.rollers, 'pop'], [K.press, 'clank'], [K.steel, 'metal'], [K.nylon, 'pop'],
    [K.skeleton, 'pop'], [K.flex, 'boing'], [K.tons, 'fall'], [K.weightLand, 'clank'], [K.rasgar, 'ding'],
    [22.08, 'pop'], [K.beads, 'swoosh'], [K.beadsIn, 'metal'], [K.sandwich, 'pop'], [K.inflate, 'inflate'],
    [K.greenT, 'whoosh'], [K.greenT + 0.15, 'pop'], [K.liso, 'sparkle'],
    [32.05, 'thump'], [32.3, 'swoosh'], [K.vulc, 'pop'], [K.forno, 'whoosh'], [K.forno + 0.35, 'clank'], [K.forno + 0.4, 'steam', 3.2],
    [K.pressao, 'alarm'], [K.temp, 'rise'], [K.molec, 'pop'], [K.molde, 'clank'], [K.molde + 0.05, 'steam', 1.2], [K.sulcos, 'steam', 1.4], [K.sulcos + 0.1, 'sparkle'],
    [42.05, 'swoosh'], [K.scan, 'laser'], [K.bolhas, 'beep'], [K.aprov, 'stamp'], [K.aprov + 0.12, 'ding'],
    [K.pronto - 0.4, 'swoosh'], [K.mount, 'metal'], [K.km, 'engine'], [K.asfalto, 'steam', 0.9], [K.porque, 'pop'],
  ];
  INGR.forEach(g => { EV.push([g.ts, 'swoosh'], [g.cue, 'pop'], [g.land, 'splat']); });
  LAYER_T.forEach(lt => EV.push([lt, 'tick']));
  for (const tb of [4, 12, 22, 32, 42]) EV.push([tb - 0.2, 'swoosh']);
  EV.sort((a, b) => a[0] - b[0]);

  /* Impactos de câmera: [tempo, amplitude(px), decaimento] */
  SHAKES = [
    [K.zoom + 0.25, 18, 7], [K.alert, 14, 6], [K.receita, 10, 8],
    [4.12, 16, 6], [K.preto, 34, 5], [K.ultra, 20, 6],
    [K.press, 12, 7], [K.steel + 0.3, 8, 8], [K.weightLand, 42, 4.5],
    [K.beadsIn, 16, 7], [K.inflate + 0.9, 14, 6], [K.greenT + 0.15, 18, 6],
    [32.05 + 0.55, 18, 6], [K.forno + 0.35, 52, 3.5], [K.temp, 14, 5], [K.molde, 30, 4], [K.sulcos, 16, 6],
    [K.aprov, 30, 5], [K.mount, 18, 7],
  ];
  INGR.forEach(g => SHAKES.push([g.land, 14, 7]));
}
function shakeAt(t) {
  let a = 0;
  for (const [ti, amp, dec] of SHAKES) if (t >= ti && t - ti < 2.5) a += amp * Math.exp(-(t - ti) * dec);
  /* tremores contínuos: misturador ligado e prensa fechada */
  if (t > INGR[0].land && t < 11.9) a += 3 + 1.6 * INGR.filter(g => t > g.land).length;
  if (t > K.forno + 0.35 && t < K.sulcos) a += 5;
  return a * (REDUCED ? 0.3 : 1);
}

/* ============================================================
   ÁUDIO: efeitos 100% sintetizados com Web Audio API
   ============================================================ */
const AU = { ctx: null, master: null, sfx: null, music: null, rec: null, noise: null, muted: false };
function audioInit() {
  if (AU.ctx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const a = new AC();
  AU.ctx = a;
  const comp = a.createDynamicsCompressor();
  comp.threshold.value = -16; comp.knee.value = 12; comp.ratio.value = 5; comp.attack.value = 0.003; comp.release.value = 0.2;
  AU.master = a.createGain(); AU.master.gain.value = 0.85;
  AU.master.connect(comp); comp.connect(a.destination);
  if (a.createMediaStreamDestination) { AU.rec = a.createMediaStreamDestination(); comp.connect(AU.rec); }
  AU.sfx = a.createGain(); AU.sfx.connect(AU.master);
  AU.music = a.createGain(); AU.music.gain.value = 0.3; AU.music.connect(AU.master);
  const len = a.sampleRate * 2, buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  AU.noise = buf;
}
function tone(type, f0, f1, dur, vol, when = 0, dest = AU.sfx, attack = 0.005) {
  const a = AU.ctx, t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + 0.05);
}
function hiss(dur, vol, type, f0, f1, q = 1, when = 0, attack = 0.01, dest = AU.sfx) {
  const a = AU.ctx, t = a.currentTime + when, s = a.createBufferSource(), fl = a.createBiquadFilter(), g = a.createGain();
  s.buffer = AU.noise; s.loop = true;
  fl.type = type; fl.Q.value = q;
  fl.frequency.setValueAtTime(f0, t);
  fl.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + Math.min(attack, dur * 0.5));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(fl); fl.connect(g); g.connect(dest); s.start(t, Math.random()); s.stop(t + dur + 0.05);
}
const SND = {
  pop()     { tone('sine', 380, 1150, 0.13, 0.55); tone('triangle', 900, 1600, 0.06, 0.16, 0.01); },
  tick()    { tone('square', 1800, 1800, 0.035, 0.1); },
  swoosh()  { hiss(0.42, 0.5, 'bandpass', 250, 4200, 1.4, 0, 0.2); },
  whoosh()  { hiss(0.35, 0.55, 'bandpass', 4500, 300, 1.1, 0, 0.04); tone('sine', 220, 70, 0.3, 0.3); },

function throwParticles(c, t, g, gi) {

  rec.ondataavailable = e => { if (e.data && e.data.size) recChunks.push(e.data); };
  rec.onstop = () => {
    setRecUI(false);
    const blob = new Blob(recChunks, { type: 'video/webm' }), url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'como-nasce-um-pneu.webm';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    toast('Vídeo salvo como como-nasce-um-pneu.webm (a voz sintetizada não entra na gravação).', 5000);
  };
  restart();
  rec.start(250);
  setRecUI(true);
  toast('Gravando 48 s com efeitos sonoros. Mantenha esta aba visível.', 4000);
}
function begin() {
  audioInit();
  if (AU.ctx && AU.ctx.state === 'suspended') AU.ctx.resume();
  setMuted(AU.muted);
  setVoice($('optVoice').checked);
  opts.music = $('optMusic').checked;
  $('overlay').hidden = true;
  if (!state.started) { state.started = true; restart(); }
}

$('startBtn').addEventListener('click', begin);
$('optDark').addEventListener('change', e => setDark(e.target.checked));
$('optMusic').addEventListener('change', e => { opts.music = e.target.checked; });
$('bPlay').addEventListener('click', () => { if (!state.started) return begin(); state.playing ? pause() : play(); });
$('bRestart').addEventListener('click', () => { if (!state.started) return begin(); restart(); });
$('bSound').addEventListener('click', () => setMuted(!AU.muted));
$('bVoice').addEventListener('click', () => setVoice(!opts.voice));
$('bTheme').addEventListener('click', () => setDark(TH !== THEMES.dark));
$('bRec').addEventListener('click', startRecording);
document.addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); if (!state.started) begin(); else state.playing ? pause() : play(); }
  else if (e.key === 'r' || e.key === 'R') { if (state.started) restart(); }
  else if (e.key === 'm' || e.key === 'M') setMuted(!AU.muted);
  else if (e.key === 'v' || e.key === 'V') setVoice(!opts.voice);
});
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

buildTimeline();
buildKeys();
/* Antes do início, o gancho (0–4 s) roda em silêncio por trás da tela de início; espera a fonte para medir o texto. */
render(K.alert + 0.35);
const fontsReady = document.fonts && document.fonts.load ? Promise.race([document.fonts.load(f(900, 80)), new Promise(r => setTimeout(r, 1500))]) : Promise.resolve();
fontsReady.then(() => requestAnimationFrame(frame));
/* Gancho de depuração: window.renderAt(12.5) desenha qualquer instante. */
window.renderAt = t => { state.started = true; $('overlay').hidden = true; pause(); state.pauseT = clamp(t, 0, DURATION - 0.001); render(state.pauseT); };
</script>
